<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THSR PA Analysis</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --bg0:#070b16;
      --bg1:#0b1020;
      --panel:#0a1328;
      --line:rgba(255,255,255,0.10);
      --line2:rgba(255,255,255,0.16);
      --txt:#e7eefc;
      --muted:#9ab0d8;
      --accent:#2b7cff;
      --accent2:#00d6ff;
      --danger:#ff2b2b;
      --orange:#ff9a3c;

      --tipbg:#061a38;
      --tipbd:rgba(0,214,255,0.25);
      --tipshadow:rgba(0,0,0,0.55);
    }

    html, body { height: 100%; margin: 0; background:var(--bg1); color:var(--txt); }
    .app { display:flex; height:100vh; width:100vw; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }

    .leftCol{
      width:50vw; height:100vh;
      display:flex; flex-direction:column;
      overflow:hidden;
      background:#0a0f1e;
      position:relative;
    }
    #map { flex: 1 1 auto; min-height: 0; }

    /* Map top overlay filter bar */
    .mapTopBar{
      position:absolute;
      top:10px;
      left:50%;
      transform: translateX(-50%);
      z-index: 2000;
      pointer-events: auto;
    }
    .filter-bar{
      pointer-events: auto;
      background: rgba(10,19,40,0.92);
      border:1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.38);
      padding: 8px 10px;
      display:flex;
      align-items:center;
      gap:10px;
      backdrop-filter: blur(6px);
      min-width: 420px;
      max-width: min(94vw, 780px);
      overflow: visible;
    }

    /* Diagnostics overlay */
    .diagBox{
      position:absolute;
      left: 10px;
      top: 10px;
      z-index: 2200;
      width: 360px;
      max-width: calc(50vw - 20px);
      background: rgba(10,19,40,0.92);
      border:1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none; /* just display */
    }
    .diagBox .ttl{
      font-weight: 1000;
      margin-bottom: 6px;
      color: rgba(231,238,252,0.95);
      text-shadow: 0 0 10px rgba(43,124,255,0.25);
    }
    .diagRow{ display:flex; gap:8px; align-items:baseline; }
    .k{ color: rgba(154,176,216,0.95); min-width: 110px; }
    .v{ color: rgba(231,238,252,0.92); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bad{ color:#ffb0b0; white-space: pre-wrap; word-break: break-word; }

    /* Multi select */
    .msel{ position:relative; display:flex; align-items:center; gap:6px; }
    .msel .lbl{
      font-size:12px;
      font-weight:900;
      color: rgba(231,238,252,0.88);
      white-space:nowrap;
    }
    .msel-btn{
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: var(--txt);
      border-radius:10px;
      padding:6px 8px;
      cursor:pointer;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      user-select:none;
      min-width: 90px;
      max-width: 170px;
    }
    .msel-btn:hover{
      background: rgba(255,154,60,0.10);
      border-color: rgba(255,154,60,0.30);
    }
    .msel-btn .sum{
      flex:1;
      text-align:left;
      font-size:11px;
      color: rgba(154,176,216,0.95);
      overflow:hidden;
      white-space:nowrap;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .msel-menu{
      position:absolute;
      top: calc(100% + 6px);
      left:0;
      min-width: 120px;
      box-sizing: border-box;
      max-height: 260px;
      overflow:auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(6,18,40,0.98);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      display:none;
      z-index: 10000;
      padding: 8px;
    }
    .msel-tools{
      display:flex; gap:8px; margin-bottom:8px;
      position: sticky;
      top: 0;
      background: rgba(6,18,40,0.98);
      padding-bottom: 8px;
      z-index: 1;
    }
    .tbtn{
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: var(--txt);
      border-radius:10px;
      padding:5px 8px;
      font-weight:900;
      cursor:pointer;
      font-size:11px;
      user-select:none;
      white-space:nowrap;
    }
    .tbtn:hover{ background: rgba(43,124,255,0.10); border-color: rgba(43,124,255,0.30); }
    .msel-menu .item{
      display:flex; align-items:center; gap:8px;
      padding: 6px 6px;
      border-radius: 8px;
      cursor:pointer;
      user-select:none;
      color: rgba(231,238,252,0.92);
      border: 1px solid transparent;
    }
    .msel-menu .item:hover{
      background: rgba(43,124,255,0.12);
      border-color: rgba(43,124,255,0.20);
    }
    .msel-menu input{ cursor:pointer; }

    /* RIGHT */
    #panel{
      width:50vw; height:100vh; overflow:hidden;
      box-sizing:border-box; border-left:1px solid var(--line);
      display:flex; flex-direction:column;
      background: linear-gradient(180deg, var(--panel) 0%, var(--bg1) 100%);
      position:relative;
    }

    .topbar{
      position:relative;
      z-index:2;
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      gap:10px;
      background: linear-gradient(180deg, rgba(11,26,51,0.92) 0%, rgba(10,19,40,0.88) 100%);
      backdrop-filter: blur(6px);
    }
    .title-wrap { display:flex; align-items:baseline; gap:10px; min-width: 0; }
    .title-wrap h2 {
      margin:0; font-size:18px; white-space:nowrap;
      letter-spacing: .5px;
      text-shadow: 0 0 12px rgba(43,124,255,0.35);
    }
    .verTag { color:var(--muted); font-weight:800; white-space:nowrap; }
    .selectionTag{
      color:var(--muted); font-size:12px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; max-width: 24vw;
    }

    .btns{ display:flex; gap:8px; align-items:center; position:relative; z-index:2; }
    .btn{
      border:1px solid var(--line2);
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      padding:6px 10px;
      cursor:pointer;
      font-weight:800;
      user-select:none;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      color: var(--txt);
      transition: .15s ease;
    }
    .btn:hover{
      background: rgba(43,124,255,0.10);
      border-color: rgba(43,124,255,0.40);
      box-shadow: 0 0 18px rgba(43,124,255,0.12);
    }
    .tag{
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      padding:6px 10px;
      color: rgba(231,238,252,0.92);
      font-weight: 900;
      font-size: 12px;
      white-space:nowrap;
      box-shadow: 0 0 14px rgba(0,0,0,0.25);
    }
    .tag b{ color: var(--accent2); }

    .hint{
      position:relative;
      z-index:2;
      padding: 8px 12px;
      color: var(--muted);
      font-size:12px;
      border-bottom:1px solid var(--line);
      background: rgba(11,26,51,0.62);
      backdrop-filter: blur(6px);
      line-height: 1.35;
    }

    .table-wrap { position:relative; z-index:2; flex:1; overflow:auto; padding: 10px 10px 12px 10px; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; color: var(--txt); }
    thead th{
      position: sticky; top: 0; z-index: 2;
      background: rgba(10,19,40,0.92);
      border-bottom: 1px solid var(--line2);
      border-right: 1px solid var(--line);
      padding: 8px 8px;
      cursor: pointer;
      user-select:none;
      white-space: nowrap;
    }
    thead th:hover{ background: rgba(43,124,255,0.16); }
    thead th .sort{ margin-left:6px; color: rgba(231,238,252,0.75); font-weight:900; }

    th, td{
      border-bottom: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.10);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
      background: rgba(0,0,0,0.00);
    }
    tbody tr:hover { background: rgba(43,124,255,0.08); }
    tbody tr.row-clickable { cursor: pointer; }
    tbody tr.row-clickable:hover { background: rgba(255,43,43,0.10); }

    .muted { color: var(--muted); }

    /* H3 labels */
    .lblWrap{
      position: relative;
      transform: translate(-50%, 0);
      pointer-events:none;
      white-space: nowrap;
    }
    .count-label{
      color:#fff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 1000;
      line-height: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.40);
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(220, 20, 20, 0.92);
      text-shadow: 0 0 10px rgba(255,80,80,0.35);
      display:inline-block;
    }
    .name-label{
      color:#fff;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 1000;
      line-height: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(220, 20, 20, 0.70);
      text-shadow: 0 0 10px rgba(255,80,80,0.25);
      display:inline-block;
    }

    /* tooltip */
    .leaflet-tooltip{
      background: var(--tipbg) !important;
      color: #ffffff !important;
      border: 1px solid var(--tipbd) !important;
      box-shadow: 0 10px 24px var(--tipshadow) !important;
      border-radius: 12px !important;
      padding: 10px 10px !important;
      backdrop-filter: blur(6px);
    }
    .leaflet-tooltip:before{
      border-top-color: var(--tipbg) !important;
      border-bottom-color: var(--tipbg) !important;
    }
    .h3-tip { line-height: 1.35; color:#fff; }
    .h3-tip b { display:inline-block; min-width: 170px; color: rgba(210,232,255,0.95); }

    /* Leaflet controls */
    .res-ctrl, .layer-ctrl{
      background: rgba(10,19,40,0.92);
      border:1px solid rgba(255,255,255,0.16);
      border-radius:12px;
      padding:10px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      font-size:12px;
      line-height:1.2;
      color: var(--txt);
      backdrop-filter: blur(6px);
    }
    .res-ctrl .ttl, .layer-ctrl .ttl{
      font-weight:1000;
      margin-bottom:8px;
      letter-spacing:.5px;
      color: #d7e6ff;
      text-shadow: 0 0 10px rgba(43,124,255,0.25);
    }
    .res-ctrl label, .layer-ctrl label{
      display:flex; align-items:center; gap:6px;
      margin:6px 0; cursor:pointer; user-select:none;
      color: rgba(231,238,252,0.92);
    }
    .res-ctrl input{ cursor:pointer; accent-color: var(--accent); }
    .layer-ctrl input{ cursor:pointer; accent-color: var(--accent2); }

  </style>
</head>

<body>
  <div class="app">
    <div class="leftCol">
      <div id="map"></div>

      <div class="mapTopBar">
        <div class="filter-bar" id="filterBar">
          <div id="filterMount" style="display:flex;align-items:center;gap:10px;"></div>
        </div>
      </div>

      <div class="diagBox" id="diagBox">
        <div class="ttl">H3 Diagnostics (ver 7.4)</div>
        <div class="diagRow"><div class="k">H3 lib</div><div class="v" id="dH3">pending</div></div>
        <div class="diagRow"><div class="k">PA rows</div><div class="v" id="dRows">0</div></div>
        <div class="diagRow"><div class="k">Red RES8/9/10/11</div><div class="v" id="dRed">0/0/0/0</div></div>
        <div class="diagRow"><div class="k">Blue RES8/9/10/11</div><div class="v" id="dBlue">0/0/0/0</div></div>
        <div class="diagRow"><div class="k">Render status</div><div class="v" id="dStatus">booting...</div></div>
        <div class="diagRow"><div class="k">First render error</div><div class="bad" id="dErr">(none)</div></div>
      </div>
    </div>

    <div id="panel">
      <div class="topbar">
        <div class="title-wrap">
          <h2>THSR PA Analysis</h2>
          <div class="verTag">ver 7.4</div>
          <div class="selectionTag" id="selectionTag" title=""></div>
        </div>

        <div class="btns">
          <div class="tag">Zoom: <b id="zoomLevel">-</b></div>
          <div class="btn" id="btnClear" title="清除篩選與選取">清除篩選</div>
        </div>
      </div>

      <div class="hint">
        這版先強制把「H3 畫不出來」的原因顯示在左上角 H3 Diagnostics：你會看到 red/blue 數量、以及第一個 render error。
      </div>

      <div class="table-wrap">
        <table id="evtTable">
          <thead><tr id="evtHeadRow"></tr></thead>
          <tbody id="evtBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4.4.0/dist/h3-js.umd.js"></script>

  <script>
    /* ========= Diagnostics hooks ========= */
    const dH3 = document.getElementById('dH3');
    const dRows = document.getElementById('dRows');
    const dRed = document.getElementById('dRed');
    const dBlue = document.getElementById('dBlue');
    const dStatus = document.getElementById('dStatus');
    const dErr = document.getElementById('dErr');

    let firstRenderError = null;
    function setDiagStatus(s){ dStatus.textContent = s; }
    function setDiagError(s){ if (!firstRenderError){ firstRenderError = s; dErr.textContent = s; } }

    /* ========= CSV ========= */
    function parseCsvRobust(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (ch === '\r') {}
          else cur += ch;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }
      while (rows.length && rows[rows.length - 1].every(v => (v ?? '').trim() === '')) rows.pop();
      if (rows.length < 2) return [];

      let header = rows[0].map(h => (h ?? '').trim());
      if (header.length && header[0] && header[0].charCodeAt(0) === 0xFEFF) header[0] = header[0].replace('\uFEFF','');

      const data = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        if (!cols || cols.every(v => (v ?? '').trim() === '')) continue;
        const obj = {};
        for (let c = 0; c < header.length; c++) obj[header[c]] = (cols[c] ?? '').trim();
        data.push(obj);
      }
      return data;
    }

    async function fetchNoStore(absUrl) {
      const res = await fetch(absUrl, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText} (${absUrl})`);
      return res.text();
    }

    function cleanH3Index(s){
      // 去掉常見不可見字元：BOM、ZWNBSP、空白
      return String(s ?? '')
        .replace(/\uFEFF/g,'')
        .replace(/\u200B/g,'')
        .replace(/\u2060/g,'')
        .trim();
    }

    /* ========= H3 Compat ========= */
    function getH3Lib(){
      // Most likely global is window.h3, but keep fallback for safety
      return window.h3 || window.h3js || window.H3 || null;
    }

    function h3BoundaryLatLng(H, h3Index) {
      const idx = cleanH3Index(h3Index);
      if (!idx) throw new Error('Empty H3 index');

      // v4+
      if (typeof H.cellToBoundary === 'function') {
        const pts = H.cellToBoundary(idx, true); // [[lat,lng],...]
        return pts.map(p => [p[0], p[1]]);
      }
      // legacy
      if (typeof H.h3ToGeoBoundary === 'function') {
        const pts = H.h3ToGeoBoundary(idx, true);
        return pts.map(p => [p[0], p[1]]);
      }
      throw new Error('No boundary function (cellToBoundary/h3ToGeoBoundary)');
    }

    function h3CenterLatLng(H, h3Index){
      const idx = cleanH3Index(h3Index);
      if (!idx) throw new Error('Empty H3 index');

      if (typeof H.cellToLatLng === 'function') {
        const c = H.cellToLatLng(idx);
        return [c[0], c[1]];
      }
      if (typeof H.h3ToGeo === 'function') {
        const c = H.h3ToGeo(idx);
        return [c[0], c[1]];
      }
      throw new Error('No center function (cellToLatLng/h3ToGeo)');
    }

    /* ========= Leaflet base ========= */
    const baseEMAP = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );
    const baseEMAP01 = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );

    const map = L.map('map', { center:[23.7,121.0], zoom:8, layers:[baseEMAP] });
    L.control.layers(
      { 'NLSC 彩色 (EMAP)': baseEMAP, 'NLSC 灰階 (EMAP01)': baseEMAP01 },
      null,
      { collapsed:true }
    ).addTo(map);

    const zoomLevelEl = document.getElementById('zoomLevel');
    function updateZoomTag(){ zoomLevelEl.textContent = String(map.getZoom()); }
    updateZoomTag();
    map.on('zoomend', updateZoomTag);

    /* ========= H3 layers ========= */
    const h3Layers = { RES8:L.layerGroup(), RES9:L.layerGroup(), RES10:L.layerGroup(), RES11:L.layerGroup() };
    const aggLabelLayer = L.layerGroup().addTo(map);
    const nameLabelLayer = L.layerGroup().addTo(map);
    let currentResKey = 'RES9';

    const redGrid = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };
    const blueGrid = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };

    const redLabelItems = { RES8:[], RES9:[], RES10:[], RES11:[] };

    function makeCountIconHtml(count){
      return `<div class="lblWrap" style="transform:translate(-50%, 10px);"><span class="count-label">${count}</span></div>`;
    }
    function makeNameIconHtml(text){
      return `<div class="lblWrap" style="transform:translate(-50%, -48px);"><span class="name-label">${text}</span></div>`;
    }

    function bucketSizeForZoom(z) { return Math.max(26, 92 - z * 4); }

    function renderAggLabels() {
      aggLabelLayer.clearLayers();
      const items = redLabelItems[currentResKey] || [];
      if (!items.length) return;

      const z = map.getZoom();
      if (z >= 12) {
        for (const it of items) {
          const icon = L.divIcon({ className: '', html: makeCountIconHtml(it.count), iconSize: null });
          L.marker(it.latlng, { icon, interactive:false, zIndexOffset: 9999 }).addTo(aggLabelLayer);
        }
        return;
      }

      const bs = bucketSizeForZoom(z);
      const buckets = new Map();
      for (const it of items) {
        const p = map.latLngToContainerPoint(it.latlng);
        const bx = Math.floor(p.x / bs);
        const by = Math.floor(p.y / bs);
        const key = `${bx},${by}`;
        let b = buckets.get(key);
        if (!b) b = { sum:0, n:0, latSum:0, lngSum:0 };
        b.sum += it.count;
        b.n += 1;
        b.latSum += it.latlng.lat;
        b.lngSum += it.latlng.lng;
        buckets.set(key, b);
      }

      for (const b of buckets.values()) {
        if (!b.sum) continue;
        const lat = b.latSum / b.n;
        const lng = b.lngSum / b.n;
        const icon = L.divIcon({ className: '', html: makeCountIconHtml(b.sum), iconSize: null });
        L.marker([lat, lng], { icon, interactive:false, zIndexOffset: 9999 }).addTo(aggLabelLayer);
      }
    }

    function renderNameLabels() {
      nameLabelLayer.clearLayers();
      const z = map.getZoom();
      if (z < 12) return;
      const items = redLabelItems[currentResKey] || [];
      for (const it of items) {
        if (!it.nameText) continue;
        const icon = L.divIcon({ className: '', html: makeNameIconHtml(it.nameText), iconSize: null });
        L.marker(it.latlng, { icon, interactive:false, zIndexOffset: 9000 }).addTo(nameLabelLayer);
      }
    }

    function showOnlyRes(resKey) {
      for (const k of ['RES8','RES9','RES10','RES11']) {
        if (map.hasLayer(h3Layers[k])) map.removeLayer(h3Layers[k]);
      }
      map.addLayer(h3Layers[resKey]);
      currentResKey = resKey;
      renderAggLabels();
      renderNameLabels();
    }

    const ResControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'res-ctrl');
        div.innerHTML = `
          <div class="ttl">H3 Resolution</div>
          <label><input type="radio" name="res" value="RES8"> RES8</label>
          <label><input type="radio" name="res" value="RES9" checked> RES9</label>
          <label><input type="radio" name="res" value="RES10"> RES10</label>
          <label><input type="radio" name="res" value="RES11"> RES11</label>
        `;
        L.DomEvent.disableClickPropagation(div);
        div.querySelectorAll('input[name="res"]').forEach(inp => {
          inp.addEventListener('change', (e) => { if (e.target.checked) showOnlyRes(e.target.value); });
        });
        return div;
      }
    });
    map.addControl(new ResControl());

    map.on('zoomend moveend', () => { renderAggLabels(); renderNameLabels(); });

    /* ========= Filter UI (minimal keep, doesn't block H3) ========= */
    const filterState = { Date:new Set(), measurement_NetWork:new Set(), measurement_Script:new Set(), Marea:new Set() };
    const filterAllOptions = { Date:[], measurement_NetWork:[], measurement_Script:[], Marea:[] };

    function uniqSorted(values){
      return Array.from(new Set(values.filter(v => v !== ''))).sort();
    }
    function summaryText(key){
      const all = filterAllOptions[key] || [];
      const set = filterState[key];
      if (set.size === 0) return 'none';
      if (set.size === all.length) return 'all';
      const arr = Array.from(set);
      if (arr.length <= 2) return arr.join('、');
      return `${arr.slice(0,2).join('、')} +${arr.length-2}`;
    }
    function createMultiSelectInline({title, key, width=140, alignRight=false}) {
      const wrap = document.createElement('div');
      wrap.className = 'msel';
      wrap.style.pointerEvents = 'auto';

      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = title;

      const btn = document.createElement('div');
      btn.className = 'msel-btn';
      btn.style.width = width + 'px';
      btn.innerHTML = `<span class="sum" title=""></span><span>▾</span>`;

      const menu = document.createElement('div');
      menu.className = 'msel-menu';

      const tools = document.createElement('div');
      tools.className = 'msel-tools';
      tools.innerHTML = `<div class="tbtn" data-act="all">全選</div><div class="tbtn" data-act="none">全不選</div><div class="tbtn" data-act="close">關閉</div>`;
      menu.appendChild(tools);

      const list = document.createElement('div');
      menu.appendChild(list);

      function setOpen(v){
        if (v) {
          const w = btn.getBoundingClientRect().width;
          menu.style.width = Math.ceil(w) + 'px'; // ✅ adaptive
          if (alignRight) { menu.style.left = 'auto'; menu.style.right = '0'; }
          else { menu.style.left = '0'; menu.style.right = 'auto'; }
        }
        menu.style.display = v ? 'block' : 'none';
      }

      function updateButton(){
        const sumEl = btn.querySelector('.sum');
        const t = summaryText(key);
        sumEl.textContent = t;
        sumEl.title = Array.from(filterState[key]).join('、') || '(none)';
      }

      btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(menu.style.display !== 'block'); });

      tools.addEventListener('click', (e) => {
        const act = e.target?.dataset?.act;
        if (!act) return;
        if (act === 'close') { setOpen(false); return; }
        if (act === 'none') { filterState[key].clear(); }
        if (act === 'all') { filterState[key].clear(); for (const v of filterAllOptions[key]) filterState[key].add(v); }
        updateButton();
        list.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = filterState[key].has(cb.dataset.v));
      });

      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) setOpen(false); });

      wrap.appendChild(lbl); wrap.appendChild(btn); wrap.appendChild(menu);

      return {
        el: wrap,
        setOptions: (options) => {
          list.innerHTML = '';
          filterAllOptions[key] = options.slice();
          filterState[key].clear();
          for (const v of options) filterState[key].add(v);

          for (const v of options) {
            const item = document.createElement('div');
            item.className = 'item';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = true;
            cb.dataset.v = v;

            const sp = document.createElement('div');
            sp.textContent = v || '(blank)';

            item.appendChild(cb); item.appendChild(sp);
            item.addEventListener('click', (ev) => {
              ev.stopPropagation();
              if (ev.target !== cb) cb.checked = !cb.checked;
              if (cb.checked) filterState[key].add(v); else filterState[key].delete(v);
              updateButton();
            });
            list.appendChild(item);
          }
          updateButton();
        }
      };
    }

    const filterMount = document.getElementById('filterMount');
    const fwDate = createMultiSelectInline({title:'Date', key:'Date', width:150});
    const fwNet  = createMultiSelectInline({title:'Net', key:'measurement_NetWork', width:105});
    const fwScr  = createMultiSelectInline({title:'Script', key:'measurement_Script', width:140});
    const fwArea = createMultiSelectInline({title:'Marea', key:'Marea', width:105, alignRight:true});
    filterMount.appendChild(fwDate.el);
    filterMount.appendChild(fwNet.el);
    filterMount.appendChild(fwScr.el);
    filterMount.appendChild(fwArea.el);

    /* ========= Right table minimal ========= */
    const evtHeadRow = document.getElementById('evtHeadRow');
    const evtBody = document.getElementById('evtBody');
    const COLS = ['Date','start_location_name','end_location_name','PA_Num','event','time_tw','lag_ms','measurement_NetWork','measurement_Script','Marea'];
    evtHeadRow.innerHTML = COLS.map(c => `<th>${c}</th>`).join('');

    function renderTableRows(rows){
      evtBody.innerHTML = rows.map(r => `<tr>${COLS.map(c => `<td title="${(r[c]??'')}">${(r[c]??'')}</td>`).join('')}</tr>`).join('');
    }

    /* ========= Build H3 ========= */
    const redCounts = { RES8:0, RES9:0, RES10:0, RES11:0 };
    const blueCounts = { RES8:0, RES9:0, RES10:0, RES11:0 };

    function resetH3(){
      for (const k of ['RES8','RES9','RES10','RES11']) {
        h3Layers[k].clearLayers();
        redGrid[k].clear(); blueGrid[k].clear();
        redLabelItems[k] = [];
      }
      aggLabelLayer.clearLayers();
      nameLabelLayer.clearLayers();
      for (const k of ['RES8','RES9','RES10','RES11']) { redCounts[k]=0; blueCounts[k]=0; }
      firstRenderError = null;
      dErr.textContent = '(none)';
    }

    function updateDiagCounts(){
      dRed.textContent = `${redGrid.RES8.size}/${redGrid.RES9.size}/${redGrid.RES10.size}/${redGrid.RES11.size}`;
      dBlue.textContent = `${blueGrid.RES8.size}/${blueGrid.RES9.size}/${blueGrid.RES10.size}/${blueGrid.RES11.size}`;
    }

    function buildRedGrid(rows){
      for (const r of rows) {
        const add = (resKey, h3Index) => {
          const idx = cleanH3Index(h3Index);
          if (!idx) return;
          let meta = redGrid[resKey].get(idx);
          if (!meta) { meta = { h3: idx, count:0, name: (r.start_location_name||'') }; redGrid[resKey].set(idx, meta); }
          meta.count += 1;
        };
        add('RES8', r.start_H3_Res_8);
        add('RES9', r.start_H3_Res_9);
        add('RES10', r.start_H3_Res_10);
        add('RES11', r.start_H3_Res_11);
      }
    }

    function drawH3(H){
      setDiagStatus('drawing polygons...');
      // label items
      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        const items = [];
        for (const meta of redGrid[resKey].values()) {
          try{
            const c = h3CenterLatLng(H, meta.h3);
            items.push({ latlng: L.latLng(c[0], c[1]), count: meta.count, nameText: meta.name });
          }catch(e){
            setDiagError(`Center fail: ${meta.h3}\n${String(e.message||e)}`);
          }
        }
        redLabelItems[resKey] = items;
      }

      // polygons
      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        for (const meta of redGrid[resKey].values()) {
          try{
            const latlngs = h3BoundaryLatLng(H, meta.h3);
            const poly = L.polygon(latlngs, {
              color: 'rgba(255,43,43,0.85)',
              weight: 1.5,
              fillColor: 'rgba(255,43,43,0.18)',
              fillOpacity: 0.45
            });
            poly.bindTooltip(`<div class="h3-tip"><div><b>${resKey}</b>${meta.h3}</div><div><b>count</b>${meta.count}</div><div><b>start_location_name</b>${meta.name}</div></div>`, { sticky:true, opacity:1.0 });
            h3Layers[resKey].addLayer(poly);
          }catch(e){
            setDiagError(`Boundary fail: ${meta.h3}\n${String(e.message||e)}`);
          }
        }
      }

      updateDiagCounts();
      showOnlyRes(currentResKey);
      setDiagStatus('done');
    }

    /* ========= Load ========= */
    async function main(){
      setDiagStatus('booting...');
      const H = getH3Lib();
      if (!H) {
        dH3.textContent = 'NOT FOUND (window.h3 missing)';
        setDiagStatus('FAILED');
        setDiagError('h3-js 沒有載入成功（window.h3 不存在）');
        return;
      }
      dH3.textContent = 'loaded';
      setDiagStatus('fetching CSV...');

      const paCsvUrlAbs = new URL(`./PA_data.csv?v=${Date.now()}`, location.href).toString();
      const locCsvUrlAbs = new URL(`./THSR_Location.csv?v=${Date.now()}`, location.href).toString();

      let paText = '';
      try{ paText = await fetchNoStore(paCsvUrlAbs); }
      catch(e){
        setDiagStatus('FAILED');
        setDiagError(`PA_data.csv 讀取失敗：\n${String(e.message||e)}\n${paCsvUrlAbs}`);
        return;
      }

      const rows = parseCsvRobust(paText);
      dRows.textContent = String(rows.length);

      // init filter options
      const optDate = uniqSorted(rows.map(r => (r.Date||'').trim()));
      const optNet  = uniqSorted(rows.map(r => (r.measurement_NetWork||'').trim()));
      const optScr  = uniqSorted(rows.map(r => (r.measurement_Script||'').trim()));
      const optArea = uniqSorted(rows.map(r => (r.Marea||'').trim()));
      fwDate.setOptions(optDate);
      fwNet.setOptions(optNet);
      fwScr.setOptions(optScr);
      fwArea.setOptions(optArea);

      renderTableRows(rows.slice(0, 200)); // table just show first 200 for now
      resetH3();
      buildRedGrid(rows);

      updateDiagCounts();
      setDiagStatus('redGrid built, rendering...');
      drawH3(H);
    }

    main().catch(e => {
      setDiagStatus('FAILED');
      setDiagError(String(e.stack||e));
    });
  </script>
</body>
</html>
