<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THSR PA Analysis</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { height: 100%; margin: 0; }
    .app { display:flex; height:100vh; width:100vw; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    #map { width:50vw; height:100vh; background:#f3f3f3; }
    #panel { width:50vw; height:100vh; overflow:auto; padding:16px; box-sizing:border-box; border-left:1px solid #e5e5e5; }
    .muted { color:#666; }
    .ok { color:#0a7; }
    .err { color:#c00; white-space:pre-wrap; }
    code { background:#f3f3f3; padding:2px 6px; border-radius:6px; }
    a { color: inherit; }

    /* H3 count label：紅底白字 */
    .h3-count-label{
      background: rgba(220, 0, 0, 0.92);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 800;
      line-height: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      pointer-events: none;
      white-space: nowrap;
    }

    /* 測距按鈕 */
    .leaflet-control.custom-measure {
      background: #fff;
      padding: 6px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    }
    .measure-btn {
      cursor: pointer;
      user-select: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: 700;
      background: #fafafa;
    }
    .measure-btn.active {
      background: #ffe9e9;
      border-color: #d00;
      color: #b00;
    }

    /* Tooltip 內容稍微美化 */
    .h3-tip b { display:inline-block; min-width: 160px; }
    .h3-tip { line-height: 1.35; }
  </style>
</head>

<body>
  <div class="app">
    <div id="map"></div>

    <div id="panel">
      <div style="display:flex; align-items:baseline; gap:10px;">
        <h2 style="margin:0;">THSR PA Analysis</h2>
        <div class="muted" id="verTag" style="font-weight:700;"></div>
      </div>

      <div class="muted" style="margin-top:8px;">
        底圖：NLSC EMAP / EMAP01（彩色/灰階切換）<br>
        功能：縮放拖曳、H3(RES8~RES11) 疊圖層 + 每格筆數、Hover 資訊窗口、點兩下測距<br>
        CSV：<code>PA_data.csv</code>
      </div>

      <hr>
      <div id="status" class="muted">尚未讀取 CSV</div>

      <div class="muted" style="margin-top:10px;">
        <div><b>Page URL</b>: <code id="pageUrl"></code></div>
        <div style="margin-top:6px;"><b>CSV URL</b>: <a id="csvLink" target="_blank" rel="noopener noreferrer"><code id="csvUrl"></code></a></div>
        <div style="margin-top:6px;"><b>HTTP</b>: <code id="httpInfo">-</code></div>
        <div style="margin-top:6px;"><b>H3</b>: <code id="h3Info">loading...</code></div>
      </div>

      <div id="debug" class="muted" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- h3-js UMD (global h3) -->
  <script src="https://unpkg.com/h3-js@4.4.0/dist/h3-js.umd.js"></script>

  <script>
    // ========= Version =========
    // 你規則：小修 +0.1；大修/新增功能 +1
    // 1.1 -> (新增 hover 資訊 + 新測距工具) => +1 => 2.0
    const APP_VERSION = "ver 2.0";
    document.getElementById('verTag').textContent = APP_VERSION;

    const statusEl = document.getElementById('status');
    const debugEl  = document.getElementById('debug');
    const pageUrlEl = document.getElementById('pageUrl');
    const csvUrlEl = document.getElementById('csvUrl');
    const csvLinkEl = document.getElementById('csvLink');
    const httpInfoEl = document.getElementById('httpInfo');
    const h3InfoEl = document.getElementById('h3Info');

    function setStatus(msg, cls='muted') {
      statusEl.className = cls;
      statusEl.textContent = msg;
    }
    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function toClean(s) {
      const t = String(s ?? '').trim();
      return t === '' ? '' : t;
    }
    function joinSet(set, sep='、') {
      const arr = Array.from(set).filter(Boolean);
      return arr.length ? arr.join(sep) : '';
    }

    // Robust CSV 解析：支援逗號/引號
    function parseCsvRobust(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (ch === '\r') {}
          else cur += ch;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }

      while (rows.length && rows[rows.length - 1].every(v => (v ?? '').trim() === '')) rows.pop();
      if (rows.length < 2) return [];

      const header = rows[0].map(h => (h ?? '').trim());
      const data = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        if (!cols || cols.every(v => (v ?? '').trim() === '')) continue;
        const obj = {};
        for (let c = 0; c < header.length; c++) obj[header[c]] = (cols[c] ?? '').trim();
        data.push(obj);
      }
      return data;
    }

    // ===== Map / Base Layers =====
    const baseEMAP = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );
    const baseEMAP01 = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );

    const map = L.map('map', { center:[23.7,121.0], zoom:8, layers:[baseEMAP] });

    // ===== H3 Overlay Layers =====
    const h3Layers = { RES8:L.layerGroup(), RES9:L.layerGroup(), RES10:L.layerGroup(), RES11:L.layerGroup() };
    h3Layers.RES9.addTo(map);

    L.control.layers(
      { 'NLSC 彩色 (EMAP)': baseEMAP, 'NLSC 灰階 (EMAP01)': baseEMAP01 },
      { 'H3 RES8 (start)': h3Layers.RES8, 'H3 RES9 (start)': h3Layers.RES9, 'H3 RES10 (start)': h3Layers.RES10, 'H3 RES11 (start)': h3Layers.RES11 },
      { collapsed:false }
    ).addTo(map);

    // ===== 自製測距工具（點起點、點終點顯示距離）=====
    let measureActive = false;
    let measureStart = null;          // L.LatLng
    let measureStartMarker = null;    // marker
    let measureEndMarker = null;
    let measureLine = null;

    function clearMeasureGraphics() {
      if (measureStartMarker) { map.removeLayer(measureStartMarker); measureStartMarker = null; }
      if (measureEndMarker)   { map.removeLayer(measureEndMarker);   measureEndMarker = null; }
      if (measureLine)        { map.removeLayer(measureLine);        measureLine = null; }
      measureStart = null;
    }

    function formatDistance(meters) {
      if (meters >= 1000) return `${(meters/1000).toFixed(3)} km`;
      return `${meters.toFixed(1)} m`;
    }

    function onMapClickMeasure(e) {
      if (!measureActive) return;

      if (!measureStart) {
        // 開始點：先清掉上一條
        clearMeasureGraphics();
        measureStart = e.latlng;
        measureStartMarker = L.circleMarker(measureStart, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureStartMarker.bindTooltip("起點", { permanent: false, direction: 'top' });
      } else {
        // 終止點
        const end = e.latlng;
        measureEndMarker = L.circleMarker(end, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureEndMarker.bindTooltip("終點", { permanent: false, direction: 'top' });

        measureLine = L.polyline([measureStart, end], { weight:3, opacity:0.9 }).addTo(map);

        const dist = map.distance(measureStart, end);
        const msg = `距離：${formatDistance(dist)}`;

        // 在終點顯示 popup
        L.popup({ closeButton: true, autoClose: true })
          .setLatLng(end)
          .setContent(msg)
          .openOn(map);

        // 下一次量測：讓下一次點擊重新開始（但保留 measureActive）
        measureStart = null;
      }
    }

    map.on('click', onMapClickMeasure);

    const MeasureControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'leaflet-control custom-measure');
        const btn = L.DomUtil.create('div', 'measure-btn', div);
        btn.textContent = '測距';
        btn.title = '點一下啟用/停用測距；啟用後左鍵點起點再點終點顯示距離';

        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(btn, 'click', (ev) => {
          L.DomEvent.stop(ev);
          measureActive = !measureActive;
          btn.classList.toggle('active', measureActive);

          if (!measureActive) {
            // 停用測距時清除暫存起點（保留線/點也可以；你若要停用就清掉，把下一行打開）
            measureStart = null;
          }
        });

        return div;
      }
    });
    map.addControl(new MeasureControl());

    // ===== H3: 畫蜂巢 + 累積 bounds + hover 資訊 =====
    function buildHoverHtml(meta) {
      // meta: {resNum, h3Index, locPairs:Set, kmPairs:Set, tw:Set, area:Set, center:Set, paNums:Set}
      const resNum = meta.resNum;
      const h3Index = meta.h3Index;

      const loc = joinSet(meta.locPairs, '、');     // 若同格多種 start/end 組合，用 、 分隔
      const km  = joinSet(meta.kmPairs, '、');

      const tw = joinSet(meta.tw, '、');
      const area = joinSet(meta.area, '、');
      const center = joinSet(meta.center, '、');

      // PA_Num：照你需求用 、 連接
      // 盡量維持數字排序
      const paArr = Array.from(meta.paNums)
        .filter(Boolean)
        .map(x => String(x))
        .sort((a,b) => (Number(a)-Number(b)));
      const pa = paArr.join('、');

      return `
        <div class="h3-tip">
          <div><b>1. H3_res${resNum}:</b> ${escapeHtml(h3Index)}</div>
          <div><b>2. location_name(start/end):</b> ${escapeHtml(loc)}</div>
          <div><b>3. location_KM+M(start/end):</b> ${escapeHtml(km)}</div>
          <div><b>4. twcounty:</b> ${escapeHtml(tw)}</div>
          <div><b>5. Marea:</b> ${escapeHtml(area)}</div>
          <div><b>6. Mcenter:</b> ${escapeHtml(center)}</div>
          <div><b>7. PA_Num:</b> ${escapeHtml(pa)}</div>
        </div>
      `;
    }

    function addH3CellWithCountAndMeta(h3Index, count, layerGroup, boundsAcc, meta) {
      const boundary = h3.cellToBoundary(h3Index);
      const latlngs = boundary.map(([lat, lng]) => [lat, lng]);

      const poly = L.polygon(latlngs, { weight:1, opacity:0.9, fillOpacity:0.10 });
      layerGroup.addLayer(poly);

      // bounds
      if (boundsAcc) boundsAcc.extend(poly.getBounds());

      // count label
      const center = h3.cellToLatLng(h3Index);
      const labelIcon = L.divIcon({
        className: '',
        html: `<div class="h3-count-label">${escapeHtml(count)}</div>`,
        iconSize: null
      });
      layerGroup.addLayer(L.marker([center[0], center[1]], { icon: labelIcon, interactive:false }));

      // ✅ hover 資訊窗口（sticky tooltip）
      const html = buildHoverHtml(meta);
      poly.bindTooltip(html, {
        sticky: true,
        direction: 'top',
        opacity: 0.95,
        className: '' // 用預設 tooltip 框即可
      });

      // 也可以加上 hover highlight（更直覺）
      poly.on('mouseover', () => poly.setStyle({ weight: 2, fillOpacity: 0.18 }));
      poly.on('mouseout',  () => poly.setStyle({ weight: 1, fillOpacity: 0.10 }));
    }

    // ===== 聚合：對每個 RES 的 H3 cell 收集你要的資訊 =====
    function initMeta(resNum, h3Index) {
      return {
        resNum,
        h3Index,
        count: 0,
        paNums: new Set(),
        locPairs: new Set(),   // "start/end"
        kmPairs: new Set(),    // "startKM/endKM"
        tw: new Set(),
        area: new Set(),
        center: new Set()
      };
    }

    function buildAgg(rows) {
      // 回傳：{ RES8: Map(h3->meta), RES9: ..., RES10: ..., RES11: ... }
      const agg = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };

      for (const r of rows) {
        const paNum = toClean(r.PA_Num);

        const startName = toClean(r.start_location_name);
        const endName   = toClean(r.end_location_name);
        const locPair = (startName || endName) ? `${startName}/${endName}` : '';

        const startKM = toClean(r["start_location_KM+M"]);
        const endKM   = toClean(r["end_location_KM+M"]);
        const kmPair = (startKM || endKM) ? `${startKM}/${endKM}` : '';

        const twcounty = toClean(r.twcounty);
        const marea = toClean(r.Marea);
        const mcenter = toClean(r.Mcenter);

        const h8  = toClean(r.start_H3_Res_8);
        const h9  = toClean(r.start_H3_Res_9);
        const h10 = toClean(r.start_H3_Res_10);
        const h11 = toClean(r.start_H3_Res_11);

        function addTo(resKey, resNum, h) {
          if (!h) return;
          let meta = agg[resKey].get(h);
          if (!meta) { meta = initMeta(resNum, h); agg[resKey].set(h, meta); }
          meta.count += 1;
          if (paNum) meta.paNums.add(paNum);
          if (locPair) meta.locPairs.add(locPair);
          if (kmPair) meta.kmPairs.add(kmPair);
          if (twcounty) meta.tw.add(twcounty);
          if (marea) meta.area.add(marea);
          if (mcenter) meta.center.add(mcenter);
        }

        addTo('RES8',  8,  h8);
        addTo('RES9',  9,  h9);
        addTo('RES10', 10, h10);
        addTo('RES11', 11, h11);
      }

      return agg;
    }

    // ===== 讀取 CSV & 畫圖 =====
    async function loadPAData() {
      pageUrlEl.textContent = location.href;

      // H3 狀態
      if (typeof window.h3 === 'undefined') {
        h3InfoEl.textContent = 'NOT LOADED (window.h3 is undefined)';
        throw new Error('h3 is not defined (h3-js 未載入成功)');
      } else {
        const v = window.h3?.versions?.h3 || window.h3?.VERSION || 'loaded';
        h3InfoEl.textContent = `loaded (${v})`;
      }

      const csvPath = './PA_data.csv';
      const url = `${csvPath}?v=${Date.now()}`;
      const absUrl = new URL(url, location.href).toString();

      csvUrlEl.textContent = absUrl;
      csvLinkEl.href = absUrl;

      setStatus(`讀取中：${absUrl}`);

      const res = await fetch(absUrl, { cache:'no-store' });
      httpInfoEl.textContent = `${res.status} ${res.statusText}`;
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

      const text = await res.text();
      const rows = parseCsvRobust(text);

      Object.values(h3Layers).forEach(g => g.clearLayers());

      const agg = buildAgg(rows);

      const boundsAcc = L.latLngBounds([]);
      let totalCells = 0;

      const mapping = [
        ['RES8',  h3Layers.RES8],
        ['RES9',  h3Layers.RES9],
        ['RES10', h3Layers.RES10],
        ['RES11', h3Layers.RES11]
      ];

      for (const [key, layerGroup] of mapping) {
        for (const [h3Index, meta] of agg[key].entries()) {
          if (!h3.isValidCell(h3Index)) continue;
          addH3CellWithCountAndMeta(h3Index, meta.count, layerGroup, boundsAcc, meta);
          totalCells++;
        }
      }

      if (totalCells > 0 && boundsAcc.isValid()) {
        map.fitBounds(boundsAcc.pad(0.12));
      }

      setStatus(`完成：事件列 ${rows.length} 筆；蜂巢格（合計）${totalCells} 格`, 'ok');
      debugEl.innerHTML = `
        <div class="muted">
          ${APP_VERSION}<br>
          H3 唯一格數：RES8=${agg.RES8.size}、RES9=${agg.RES9.size}、RES10=${agg.RES10.size}、RES11=${agg.RES11.size}<br>
          測距：右上角按「測距」啟用後，左鍵點起點再點終點顯示距離（下一次點起點會清除上一條線）。<br>
          提示：右上 Layers 可切換彩色/灰階與 RES8~RES11 疊圖層。
        </div>
      `;
    }

    (async () => {
      try {
        await loadPAData();
      } catch (err) {
        setStatus(`讀取失敗：${err.message || err}`, 'err');
        debugEl.innerHTML = `<div class="err">${escapeHtml(err?.stack || err)}</div>`;
      }
    })();
  </script>
</body>
</html>
