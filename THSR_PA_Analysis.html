<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THSR PA Analysis</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { height: 100%; margin: 0; }
    .app { display:flex; height:100vh; width:100vw; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }

    /* 左側地圖 50% */
    #map { width:50vw; height:100vh; background:#f3f3f3; }

    /* 右側面板 50%：上方工具列 + 下方表格 */
    #panel {
      width:50vw; height:100vh; overflow:hidden;
      box-sizing:border-box; border-left:1px solid #e5e5e5;
      display:flex; flex-direction:column;
      background:#fff;
    }

    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid #eee;
      gap:10px;
    }

    .title-wrap { display:flex; align-items:baseline; gap:10px; min-width: 0; }
    .title-wrap h2 { margin:0; font-size:18px; white-space:nowrap; }
    .verTag { color:#666; font-weight:700; white-space:nowrap; }
    .selectionTag { color:#666; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 24vw; }

    .btns { display:flex; gap:8px; align-items:center; }
    .btn {
      border:1px solid #ddd;
      background:#fafafa;
      border-radius:8px;
      padding:6px 10px;
      cursor:pointer;
      font-weight:700;
      user-select:none;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .btn:hover { background:#f2f2f2; }
    .btn.active { background:#ffe9e9; border-color:#d00; color:#b00; }

    .icon-btn {
      width:36px; height:34px;
      padding:0;
      justify-content:center;
    }

    .muted { color:#666; }
    .err { color:#c00; white-space:pre-wrap; }
    code { background:#f3f3f3; padding:2px 6px; border-radius:6px; }
    a { color: inherit; }

    /* ====== H3 polygon styles ====== */
    .h3-red { /* by PA_data */ }
    .h3-blue { /* by Location mapping */ }

    /* 數字標籤：單格（跟隨網格中心） */
    .h3-count-label{
      color:#fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 800;
      line-height: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.35);
    }
    .h3-count-label.red { background: rgba(220, 0, 0, 0.92); }
    .h3-count-label.blue { background: rgba(0, 102, 204, 0.92); }
    .h3-count-label.mix { background: rgba(128, 0, 128, 0.90); } /* 混合聚合 */

    /* 聚合標籤（遠視時） */
    .agg-label{
      color:#fff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 900;
      line-height: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.38);
    }
    .agg-label.red { background: rgba(200, 0, 0, 0.92); }
    .agg-label.blue { background: rgba(0, 90, 190, 0.92); }
    .agg-label.mix { background: rgba(115, 0, 115, 0.92); }

    /* Tooltip */
    .h3-tip b { display:inline-block; min-width: 180px; }
    .h3-tip { line-height: 1.35; }

    /* 表格區域 */
    .table-wrap {
      flex:1;
      overflow:auto;
      padding: 8px 10px 12px 10px;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 12px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f7f7f7;
      border-bottom: 1px solid #ddd;
    }

    th, td {
      border-bottom: 1px solid #eee;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:hover { background:#fafafa; }

    .hint {
      padding: 6px 12px;
      color:#666;
      font-size:12px;
      border-bottom:1px solid #f0f0f0;
      background:#fff;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal {
      width: min(900px, 92vw);
      max-height: 86vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      display:flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 10px 12px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      border-bottom: 1px solid #eee;
      background:#fafafa;
    }

    .modal-body {
      padding: 12px;
      overflow:auto;
      font-size: 12px;
      line-height: 1.45;
    }

    .kv { display:grid; grid-template-columns: 160px 1fr; gap:8px 10px; }
    .kv div { padding: 2px 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .close-btn { border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; }
  </style>
</head>

<body>
  <div class="app">
    <div id="map"></div>

    <div id="panel">
      <!-- 右側第一排：按鈕列 -->
      <div class="topbar">
        <div class="title-wrap">
          <h2>THSR PA Analysis</h2>
          <div class="verTag" id="verTag"></div>
          <div class="selectionTag" id="selectionTag" title=""></div>
        </div>

        <div class="btns">
          <!-- 尺標 icon 測距 -->
          <div class="btn icon-btn" id="btnMeasure" title="測距：啟用後左鍵點起點再點終點顯示距離">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm2 0v10h14V7H5zm2 2h2v2H7V9zm4 0h2v3h-2V9zm4 0h2v2h-2V9zm-8 6h2v2H7v-2zm4-1h2v3h-2v-3zm4 1h2v2h-2v-2z"/>
            </svg>
          </div>

          <div class="btn" id="btnInfo" title="系統資訊 / 狀態 / 錯誤訊息（彈窗）">🛈 系統資訊</div>
          <div class="btn" id="btnClear" title="清除蜂巢篩選，顯示全部事件">清除篩選</div>
        </div>
      </div>

      <div class="hint" id="hintLine">
        紅格：PA_data（start_H3）；藍格：由 start_location_name 命中 THSR_Location.location_name 產生（與紅格重複者不畫）。
        遠視數字會自動聚合，拉近會拆回單格數字。
      </div>

      <!-- 表格 -->
      <div class="table-wrap">
        <table id="evtTable">
          <thead><tr id="evtHeadRow"></tr></thead>
          <tbody id="evtBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-label="系統資訊">
      <div class="modal-header">
        <div style="font-weight:800;">系統資訊（狀態 / 更新 / 錯誤）</div>
        <button class="close-btn" id="btnModalClose">關閉</button>
      </div>
      <div class="modal-body">
        <div class="kv">
          <div class="muted">Version</div><div class="mono" id="mVersion"></div>
          <div class="muted">Page URL</div><div class="mono" id="mPageUrl"></div>
          <div class="muted">PA CSV</div><div class="mono" id="mCsvPA"></div>
          <div class="muted">Location CSV</div><div class="mono" id="mCsvLoc"></div>
          <div class="muted">HTTP</div><div class="mono" id="mHttp"></div>
          <div class="muted">H3</div><div class="mono" id="mH3"></div>
          <div class="muted">Status</div><div class="mono" id="mStatus"></div>
          <div class="muted">Last Update</div><div class="mono" id="mUpdate"></div>
        </div>

        <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

        <div style="font-weight:800;margin-bottom:6px;">Errors</div>
        <div class="mono err" id="mErrors" style="white-space:pre-wrap;"></div>
      </div>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- h3-js UMD (global h3) -->
  <script src="https://unpkg.com/h3-js@4.4.0/dist/h3-js.umd.js"></script>

  <script>
    // ========= Version =========
    // ver 3.0 -> 新增：第二CSV + 紅藍網格 + 遠近聚合數字 => 大功能 +1 => ver 4.0
    const APP_VERSION = "ver 4.0";
    document.getElementById('verTag').textContent = APP_VERSION;

    // ========= Modal / status logging =========
    const modalBackdrop = document.getElementById('modalBackdrop');
    const btnInfo = document.getElementById('btnInfo');
    const btnModalClose = document.getElementById('btnModalClose');

    const mVersion = document.getElementById('mVersion');
    const mPageUrl = document.getElementById('mPageUrl');
    const mCsvPA = document.getElementById('mCsvPA');
    const mCsvLoc = document.getElementById('mCsvLoc');
    const mHttp = document.getElementById('mHttp');
    const mH3 = document.getElementById('mH3');
    const mStatus = document.getElementById('mStatus');
    const mUpdate = document.getElementById('mUpdate');
    const mErrors = document.getElementById('mErrors');

    let lastStatus = "init";
    let lastUpdateTime = "";
    const errorLogs = [];
    let httpInfo = "";
    let paCsvUrlAbs = "";
    let locCsvUrlAbs = "";
    let h3Info = "";

    function openModal() { modalBackdrop.style.display = "flex"; }
    function closeModal() { modalBackdrop.style.display = "none"; }

    btnInfo.addEventListener('click', () => {
      mVersion.textContent = APP_VERSION;
      mPageUrl.textContent = location.href;
      mCsvPA.textContent = paCsvUrlAbs;
      mCsvLoc.textContent = locCsvUrlAbs;
      mHttp.textContent = httpInfo;
      mH3.textContent = h3Info;
      mStatus.textContent = lastStatus;
      mUpdate.textContent = lastUpdateTime || '';
      mErrors.textContent = errorLogs.length ? errorLogs.join("\n\n") : "(none)";
      openModal();
    });

    btnModalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

    function setStatus(msg) { lastStatus = msg; }
    function logError(err) { errorLogs.push(String(err?.stack || err)); }

    // ========= Utilities =========
    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function toClean(s) {
      const t = String(s ?? '').trim();
      return t === '' ? '' : t;
    }
    function joinSet(set, sep='、') {
      const arr = Array.from(set).filter(Boolean);
      return arr.length ? arr.join(sep) : '';
    }

    // Robust CSV parser (supports quoted commas)
    function parseCsvRobust(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (ch === '\r') {}
          else cur += ch;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }

      while (rows.length && rows[rows.length - 1].every(v => (v ?? '').trim() === '')) rows.pop();
      if (rows.length < 2) return [];

      const header = rows[0].map(h => (h ?? '').trim());
      const data = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        if (!cols || cols.every(v => (v ?? '').trim() === '')) continue;
        const obj = {};
        for (let c = 0; c < header.length; c++) obj[header[c]] = (cols[c] ?? '').trim();
        data.push(obj);
      }
      return data;
    }

    // ========= Map / base layers =========
    const baseEMAP = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );
    const baseEMAP01 = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );

    const map = L.map('map', { center:[23.7,121.0], zoom:8, layers:[baseEMAP] });

    // ========= H3 overlay layers (polygons only) =========
    const h3Layers = {
      RES8:  L.layerGroup(),
      RES9:  L.layerGroup(),
      RES10: L.layerGroup(),
      RES11: L.layerGroup()
    };
    // 預設顯示 RES9
    h3Layers.RES9.addTo(map);

    L.control.layers(
      { 'NLSC 彩色 (EMAP)': baseEMAP, 'NLSC 灰階 (EMAP01)': baseEMAP01 },
      { 'H3 RES8': h3Layers.RES8, 'H3 RES9': h3Layers.RES9, 'H3 RES10': h3Layers.RES10, 'H3 RES11': h3Layers.RES11 },
      { collapsed:false }
    ).addTo(map);

    // ========= Label render layer (aggregated markers) =========
    const labelRenderLayer = L.layerGroup().addTo(map);

    // ========= Measure tool =========
    const btnMeasure = document.getElementById('btnMeasure');
    let measureActive = false;
    let measureStart = null;
    let measureStartMarker = null;
    let measureEndMarker = null;
    let measureLine = null;

    function clearMeasureGraphics() {
      if (measureStartMarker) { map.removeLayer(measureStartMarker); measureStartMarker = null; }
      if (measureEndMarker)   { map.removeLayer(measureEndMarker);   measureEndMarker = null; }
      if (measureLine)        { map.removeLayer(measureLine);        measureLine = null; }
      measureStart = null;
    }
    function formatDistance(meters) {
      if (meters >= 1000) return `${(meters/1000).toFixed(3)} km`;
      return `${meters.toFixed(1)} m`;
    }
    function onMapClickMeasure(e) {
      if (!measureActive) return;

      if (!measureStart) {
        clearMeasureGraphics();
        measureStart = e.latlng;
        measureStartMarker = L.circleMarker(measureStart, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureStartMarker.bindTooltip("起點", { permanent: false, direction: 'top' });
      } else {
        const end = e.latlng;
        measureEndMarker = L.circleMarker(end, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureEndMarker.bindTooltip("終點", { permanent: false, direction: 'top' });

        measureLine = L.polyline([measureStart, end], { weight:3, opacity:0.9 }).addTo(map);

        const dist = map.distance(measureStart, end);
        const msg = `距離：${formatDistance(dist)}`;

        L.popup({ closeButton: true, autoClose: true })
          .setLatLng(end)
          .setContent(msg)
          .openOn(map);

        measureStart = null;
      }
    }
    map.on('click', onMapClickMeasure);

    btnMeasure.addEventListener('click', () => {
      measureActive = !measureActive;
      btnMeasure.classList.toggle('active', measureActive);
      if (!measureActive) measureStart = null;
    });

    // ========= Right panel: event table =========
    const evtHeadRow = document.getElementById('evtHeadRow');
    const evtBody = document.getElementById('evtBody');
    const selectionTag = document.getElementById('selectionTag');
    const btnClear = document.getElementById('btnClear');

    const COLS = [
      { key: 'Date', label: 'Date' },
      { key: 'PA_Num', label: 'PA#' },
      { key: 'event', label: 'Event' },
      { key: 'time_tw', label: 'Time' },
      { key: 'lag_start_tw', label: 'LagStart' },
      { key: 'resume_tw', label: 'Resume' },
      { key: 'lag_ms', label: 'Lag(ms)' },
      { key: 'e2e_recover_ms', label: 'E2E(ms)' },
      { key: 'e2e_recover_time', label: 'E2E(Time)' },
      { key: 'lag_end_tw', label: 'LagEnd' },
      { key: 'lag_mode', label: 'LagMode' },
      { key: 'gps_type', label: 'GPS' },
      { key: 'start_lat', label: 'S.lat' },
      { key: 'start_lon', label: 'S.lon' },
      { key: 'end_lat', label: 'E.lat' },
      { key: 'end_lon', label: 'E.lon' },
      { key: 'end_action', label: 'EndAct' },
      { key: 'accuracy_m', label: 'Acc(m)' },

      { key: 'start_H3_Res_8', label: 'S.H3(8)' },
      { key: 'start_H3_Res_9', label: 'S.H3(9)' },
      { key: 'start_H3_Res_10', label: 'S.H3(10)' },
      { key: 'start_H3_Res_11', label: 'S.H3(11)' },

      { key: 'end_H3_Res_8', label: 'E.H3(8)' },
      { key: 'end_H3_Res_9', label: 'E.H3(9)' },
      { key: 'end_H3_Res_10', label: 'E.H3(10)' },
      { key: 'end_H3_Res_11', label: 'E.H3(11)' },

      { key: 'measurement_Type', label: 'Type' },
      { key: 'measurement_Path', label: 'Path' },
      { key: 'measurement_NetWork', label: 'Net' },
      { key: 'measurement_Script', label: 'Script' },

      { key: 'start_location_name', label: 'S.loc' },
      { key: 'end_location_name', label: 'E.loc' },
      { key: 'start_location_KM+M', label: 'S.KM+M' },
      { key: 'end_location_KM+M', label: 'E.KM+M' },

      { key: 'twcounty', label: 'County' },
      { key: 'Marea', label: 'Area' },
      { key: 'Mcenter', label: 'Center' },
    ];

    function renderTableHeader() {
      evtHeadRow.innerHTML = '';
      for (const c of COLS) {
        const th = document.createElement('th');
        th.textContent = c.label;
        th.title = c.key;
        evtHeadRow.appendChild(th);
      }
    }
    function renderTableRows(rows) {
      evtBody.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const tr = document.createElement('tr');
        for (const c of COLS) {
          const td = document.createElement('td');
          const v = (r[c.key] ?? '');
          td.textContent = v;
          td.title = v;
          tr.appendChild(td);
        }
        frag.appendChild(tr);
      }
      evtBody.appendChild(frag);
    }
    renderTableHeader();

    function setSelectionTag(text) {
      selectionTag.textContent = text || '';
      selectionTag.title = text || '';
    }

    // ========= Data stores =========
    let allRows = [];
    const idxByCell = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };

    // labelData per resKey: array of items {latlng, count, type:'red'|'blue', resKey, h3Index}
    const labelData = { RES8:[], RES9:[], RES10:[], RES11:[] };

    // ========= Build hover HTML =========
    function buildHoverHtmlRed(meta) {
      const resNum = meta.resNum;
      const h3Index = meta.h3Index;

      const loc = joinSet(meta.locPairs, '、');
      const km  = joinSet(meta.kmPairs, '、');

      const tw = joinSet(meta.tw, '、');
      const area = joinSet(meta.area, '、');
      const center = joinSet(meta.center, '、');

      const paArr = Array.from(meta.paNums)
        .filter(Boolean)
        .map(x => String(x))
        .sort((a,b) => (Number(a)-Number(b)));
      const pa = paArr.join('、');

      return `
        <div class="h3-tip">
          <div><b>H3_res${resNum} (PA_data):</b> ${escapeHtml(h3Index)}</div>
          <div><b>location_name(start/end):</b> ${escapeHtml(loc)}</div>
          <div><b>location_KM+M(start/end):</b> ${escapeHtml(km)}</div>
          <div><b>twcounty:</b> ${escapeHtml(tw)}</div>
          <div><b>Marea:</b> ${escapeHtml(area)}</div>
          <div><b>Mcenter:</b> ${escapeHtml(center)}</div>
          <div><b>PA_Num:</b> ${escapeHtml(pa)}</div>
          <div class="muted" style="margin-top:4px;">(點此格可在右側顯示事件明細)</div>
        </div>
      `;
    }

    function buildHoverHtmlBlue(meta) {
      // meta from location match results
      const resNum = meta.resNum;
      const h3Index = meta.h3Index;
      const names = joinSet(meta.names, '、');
      const kms = joinSet(meta.kms, '、');
      return `
        <div class="h3-tip">
          <div><b>H3_res${resNum} (Location):</b> ${escapeHtml(h3Index)}</div>
          <div><b>location_name:</b> ${escapeHtml(names)}</div>
          <div><b>KM+M:</b> ${escapeHtml(kms)}</div>
          <div><b>count (matched):</b> ${escapeHtml(meta.count)}</div>
          <div class="muted" style="margin-top:4px;">(此格由 start_location_name 命中 THSR_Location 產生)</div>
        </div>
      `;
    }

    // ========= Render polygons =========
    function initMetaRed(resNum, h3Index) {
      return {
        resNum, h3Index,
        count: 0,
        paNums: new Set(),
        locPairs: new Set(),
        kmPairs: new Set(),
        tw: new Set(),
        area: new Set(),
        center: new Set()
      };
    }

    function initMetaBlue(resNum, h3Index) {
      return {
        resNum, h3Index,
        count: 0,
        names: new Set(),
        kms: new Set()
      };
    }

    function addRowIndex(resKey, h3Index, rowIdx) {
      if (!h3Index) return;
      let s = idxByCell[resKey].get(h3Index);
      if (!s) { s = new Set(); idxByCell[resKey].set(h3Index, s); }
      s.add(rowIdx);
    }

    function addPolygonCell(resKey, meta, layerGroup, boundsAcc, type) {
      const h3Index = meta.h3Index;
      const boundary = h3.cellToBoundary(h3Index);
      const latlngs = boundary.map(([lat, lng]) => [lat, lng]);

      const style = (type === 'red')
        ? { color:'#d00', weight:1, opacity:0.95, fillColor:'#ff0000', fillOpacity:0.12 }
        : { color:'#0066cc', weight:1, opacity:0.95, fillColor:'#0066cc', fillOpacity:0.12 };

      const poly = L.polygon(latlngs, style);
      layerGroup.addLayer(poly);
      if (boundsAcc) boundsAcc.extend(poly.getBounds());

      // hover tooltip
      const html = (type === 'red') ? buildHoverHtmlRed(meta) : buildHoverHtmlBlue(meta);
      poly.bindTooltip(html, { sticky:true, direction:'top', opacity:0.95 });

      // hover highlight
      poly.on('mouseover', () => poly.setStyle({ weight: 2, fillOpacity: 0.18 }));
      poly.on('mouseout',  () => poly.setStyle({ weight: 1, fillOpacity: 0.12 }));

      // click -> filter table only for red (PA rows); blue cells filter by matching rows if possible
      poly.on('click', () => {
        const setIdx = idxByCell[resKey].get(h3Index) || new Set();
        const filtered = Array.from(setIdx).sort((a,b)=>a-b).map(i => allRows[i]);
        setSelectionTag(`篩選中：${resKey} / ${h3Index}（${filtered.length} 筆）`);
        renderTableRows(filtered);
      });

      // store label item
      const center = h3.cellToLatLng(h3Index);
      labelData[resKey].push({
        latlng: L.latLng(center[0], center[1]),
        count: meta.count,
        type, // red/blue
        resKey,
        h3Index
      });
    }

    // ========= 聚合數字：依螢幕距離 bucket =========
    function bucketSizeForZoom(z) {
      // z越小(遠) bucket越大；z越大(近) bucket越小
      // 你要「拉很遠聚合，拉近拆開」=> bucket 隨 zoom 縮小
      const bs = Math.max(26, 92 - z * 4); // 8=>60, 10=>52, 12=>44, 16=>28
      return bs;
    }

    function renderAggregatedLabels() {
      labelRenderLayer.clearLayers();

      const z = map.getZoom();
      const bs = bucketSizeForZoom(z);

      // 收集所有「目前顯示中的 RES layer」的 label items
      const activeResKeys = [];
      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        if (map.hasLayer(h3Layers[resKey])) activeResKeys.push(resKey);
      }
      if (!activeResKeys.length) return;

      const buckets = new Map();
      for (const resKey of activeResKeys) {
        for (const item of labelData[resKey]) {
          const p = map.latLngToContainerPoint(item.latlng);
          const bx = Math.floor(p.x / bs);
          const by = Math.floor(p.y / bs);
          const key = `${bx},${by}`;

          let b = buckets.get(key);
          if (!b) {
            b = { sum:0, reds:0, blues:0, n:0, latSum:0, lngSum:0 };
            buckets.set(key, b);
          }
          b.sum += Number(item.count) || 0;
          if (item.type === 'red') b.reds++;
          else if (item.type === 'blue') b.blues++;
          b.n += 1;
          b.latSum += item.latlng.lat;
          b.lngSum += item.latlng.lng;
        }
      }

      for (const b of buckets.values()) {
        if (!b.sum) continue;

        const lat = b.latSum / b.n;
        const lng = b.lngSum / b.n;

        let cls = 'mix';
        if (b.reds > 0 && b.blues === 0) cls = 'red';
        else if (b.blues > 0 && b.reds === 0) cls = 'blue';

        const icon = L.divIcon({
          className: '',
          html: `<div class="agg-label ${cls}">${escapeHtml(b.sum)}</div>`,
          iconSize: null
        });

        L.marker([lat, lng], { icon, interactive:false, zIndexOffset: 9999 }).addTo(labelRenderLayer);
      }
    }

    // map events trigger rerender
    map.on('zoomend moveend', () => renderAggregatedLabels());
    map.on('overlayadd overlayremove', () => renderAggregatedLabels());

    // ========= Load CSVs =========
    async function fetchCsv(path) {
      const url = `${path}?v=${Date.now()}`;
      return { abs: new URL(url, location.href).toString(), url };
    }

    async function loadBothCSVsAndRender() {
      setStatus("starting...");

      // H3 status
      if (typeof window.h3 === 'undefined') {
        h3Info = 'NOT LOADED (window.h3 is undefined)';
        throw new Error('h3 is not defined (h3-js 未載入成功)');
      } else {
        const v = window.h3?.versions?.h3 || window.h3?.VERSION || 'loaded';
        h3Info = `loaded (${v})`;
      }

      const pa = await fetchCsv('./PA_data.csv');
      const loc = await fetchCsv('./THSR_Location.csv');

      paCsvUrlAbs = pa.abs;
      locCsvUrlAbs = loc.abs;

      setStatus(`fetching: PA & Location`);
      const [resPA, resLoc] = await Promise.all([
        fetch(pa.abs, { cache:'no-store' }),
        fetch(loc.abs, { cache:'no-store' })
      ]);

      httpInfo = `PA:${resPA.status} ${resPA.statusText} | LOC:${resLoc.status} ${resLoc.statusText}`;
      if (!resPA.ok) throw new Error(`PA_data.csv HTTP ${resPA.status} ${resPA.statusText}`);
      if (!resLoc.ok) throw new Error(`THSR_Location.csv HTTP ${resLoc.status} ${resLoc.statusText}`);

      const [txtPA, txtLoc] = await Promise.all([resPA.text(), resLoc.text()]);
      const rowsPA = parseCsvRobust(txtPA);
      const rowsLoc = parseCsvRobust(txtLoc);

      // store all PA rows for table
      allRows = rowsPA;

      // reset indices
      for (const k of ['RES8','RES9','RES10','RES11']) idxByCell[k].clear();
      for (let i = 0; i < rowsPA.length; i++) {
        const r = rowsPA[i];
        addRowIndex('RES8',  toClean(r.start_H3_Res_8),  i);
        addRowIndex('RES9',  toClean(r.start_H3_Res_9),  i);
        addRowIndex('RES10', toClean(r.start_H3_Res_10), i);
        addRowIndex('RES11', toClean(r.start_H3_Res_11), i);
      }

      // build location_name -> list of location rows
      const locMap = new Map();
      for (const r of rowsLoc) {
        const name = toClean(r.location_name);
        if (!name) continue;
        if (!locMap.has(name)) locMap.set(name, []);
        locMap.get(name).push(r);
      }

      // clear layers & label data
      Object.values(h3Layers).forEach(g => g.clearLayers());
      for (const rk of ['RES8','RES9','RES10','RES11']) labelData[rk] = [];
      labelRenderLayer.clearLayers();

      // build red meta (PA_data start_H3) and blue meta (matched locations)
      const redAgg = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };
      const blueAgg = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };

      function addRed(resKey, resNum, h3Index, paRow) {
        if (!h3Index) return;
        let meta = redAgg[resKey].get(h3Index);
        if (!meta) { meta = initMetaRed(resNum, h3Index); redAgg[resKey].set(h3Index, meta); }

        meta.count += 1;

        const paNum = toClean(paRow.PA_Num);
        if (paNum) meta.paNums.add(paNum);

        const startName = toClean(paRow.start_location_name);
        const endName = toClean(paRow.end_location_name);
        const locPair = (startName || endName) ? `${startName}/${endName}` : '';
        if (locPair) meta.locPairs.add(locPair);

        const startKM = toClean(paRow["start_location_KM+M"]);
        const endKM = toClean(paRow["end_location_KM+M"]);
        const kmPair = (startKM || endKM) ? `${startKM}/${endKM}` : '';
        if (kmPair) meta.kmPairs.add(kmPair);

        const tw = toClean(paRow.twcounty);
        const area = toClean(paRow.Marea);
        const center = toClean(paRow.Mcenter);
        if (tw) meta.tw.add(tw);
        if (area) meta.area.add(area);
        if (center) meta.center.add(center);
      }

      function addBlue(resKey, resNum, h3Index, paRow, locRow) {
        if (!h3Index) return;
        let meta = blueAgg[resKey].get(h3Index);
        if (!meta) { meta = initMetaBlue(resNum, h3Index); blueAgg[resKey].set(h3Index, meta); }

        meta.count += 1;

        const name = toClean(locRow.location_name) || toClean(paRow.start_location_name);
        if (name) meta.names.add(name);

        // THSR_Location.csv 的 KM+M 欄位是 "KM+M"（不是 start_location_KM+M）
        const km = toClean(locRow["KM+M"]);
        if (km) meta.kms.add(km);
      }

      // 先填 redAgg
      for (const r of rowsPA) {
        addRed('RES8',  8,  toClean(r.start_H3_Res_8),  r);
        addRed('RES9',  9,  toClean(r.start_H3_Res_9),  r);
        addRed('RES10', 10, toClean(r.start_H3_Res_10), r);
        addRed('RES11', 11, toClean(r.start_H3_Res_11), r);
      }

      // 再用 start_location_name 命中 location_name，填 blueAgg
      for (const r of rowsPA) {
        const startName = toClean(r.start_location_name);
        if (!startName) continue;

        const matches = locMap.get(startName);
        if (!matches || !matches.length) continue;

        for (const locRow of matches) {
          // THSR_Location.csv 欄位是 H3_Res_8...（不是 start_H3_Res_8）
          addBlue('RES8',  8,  toClean(locRow.H3_Res_8),  r, locRow);
          addBlue('RES9',  9,  toClean(locRow.H3_Res_9),  r, locRow);
          addBlue('RES10', 10, toClean(locRow.H3_Res_10), r, locRow);
          addBlue('RES11', 11, toClean(locRow.H3_Res_11), r, locRow);
        }
      }

      // ✅ 重複：若 blueAgg 的 H3Index 同時存在 redAgg，就刪掉 blueAgg（不顯示）
      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        for (const h3Index of blueAgg[resKey].keys()) {
          if (redAgg[resKey].has(h3Index)) blueAgg[resKey].delete(h3Index);
        }
      }

      // render polygons
      const boundsAcc = L.latLngBounds([]);
      let cellsRed = 0, cellsBlue = 0;

      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        const lg = h3Layers[resKey];

        // red
        for (const [h3Index, meta] of redAgg[resKey].entries()) {
          if (!h3.isValidCell(h3Index)) continue;
          addPolygonCell(resKey, meta, lg, boundsAcc, 'red');
          cellsRed++;
        }

        // blue (non-overlap)
        for (const [h3Index, meta] of blueAgg[resKey].entries()) {
          if (!h3.isValidCell(h3Index)) continue;
          addPolygonCell(resKey, meta, lg, boundsAcc, 'blue');
          cellsBlue++;
        }
      }

      // initial table & view
      setSelectionTag('');
      renderTableRows(allRows);

      // fit (optional)
      if ((cellsRed + cellsBlue) > 0 && boundsAcc.isValid()) {
        map.fitBounds(boundsAcc.pad(0.12));
      }

      lastUpdateTime = new Date().toISOString();
      setStatus(`ok: PA_rows=${rowsPA.length}, red_cells=${cellsRed}, blue_cells=${cellsBlue}`);

      // render aggregated labels for current view / active layers
      renderAggregatedLabels();
    }

    // clear filter button
    btnClear.addEventListener('click', () => {
      setSelectionTag('');
      renderTableRows(allRows);
    });

    // run
    (async () => {
      try {
        await loadBothCSVsAndRender();
      } catch (err) {
        logError(err);
        setStatus(`FAILED: ${err.message || err}`);
      }
    })();
  </script>
</body>
</html>
