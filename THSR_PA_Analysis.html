<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THSR PA Analysis</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --bg0:#070b16;
      --bg1:#0b1020;
      --bg2:#0c142a;
      --panel:#0a1328;
      --panel2:#0b1a33;
      --line:rgba(255,255,255,0.10);
      --line2:rgba(255,255,255,0.16);
      --txt:#e7eefc;
      --muted:#9ab0d8;
      --accent:#2b7cff;
      --accent2:#00d6ff;
      --danger:#ff2b2b;
      --orange:#ff9a3c;
      --deepblue:#1240ff;
    }

    html, body { height: 100%; margin: 0; background:var(--bg1); color:var(--txt); }
    .app { display:flex; height:100vh; width:100vw; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }

    #map { width:50vw; height:100vh; background:#0a0f1e; }

    #panel{
      width:50vw; height:100vh; overflow:hidden;
      box-sizing:border-box; border-left:1px solid var(--line);
      display:flex; flex-direction:column;
      background: linear-gradient(180deg, var(--panel) 0%, var(--bg1) 100%);
      position:relative;
    }

    /* tech scanline / glow */
    #panel::before{
      content:"";
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 6px);
      pointer-events:none;
      mix-blend-mode: overlay;
      opacity:.35;
    }
    #panel::after{
      content:"";
      position:absolute; inset:-40px;
      background: radial-gradient(circle at 20% 10%, rgba(43,124,255,0.18), transparent 35%),
                  radial-gradient(circle at 80% 25%, rgba(0,214,255,0.12), transparent 40%);
      pointer-events:none;
      opacity:.9;
      filter: blur(2px);
    }

    .topbar{
      position:relative;
      z-index:2;
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      gap:10px;
      background: linear-gradient(180deg, rgba(11,26,51,0.92) 0%, rgba(10,19,40,0.88) 100%);
      backdrop-filter: blur(6px);
    }

    .title-wrap { display:flex; align-items:baseline; gap:10px; min-width: 0; }
    .title-wrap h2 {
      margin:0; font-size:18px; white-space:nowrap;
      letter-spacing: .5px;
      text-shadow: 0 0 12px rgba(43,124,255,0.35);
    }
    .verTag { color:var(--muted); font-weight:800; white-space:nowrap; }
    .selectionTag{
      color:var(--muted); font-size:12px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; max-width: 24vw;
    }

    .btns{ display:flex; gap:8px; align-items:center; position:relative; z-index:2; }
    .btn{
      border:1px solid var(--line2);
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      padding:6px 10px;
      cursor:pointer;
      font-weight:800;
      user-select:none;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      color: var(--txt);
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: .15s ease;
    }
    .btn:hover{
      background: rgba(43,124,255,0.10);
      border-color: rgba(43,124,255,0.40);
      box-shadow: 0 0 18px rgba(43,124,255,0.12);
    }
    .btn.active{
      background: rgba(255,43,43,0.18);
      border-color: rgba(255,43,43,0.60);
      color:#ffdede;
      box-shadow: 0 0 18px rgba(255,43,43,0.18);
    }

    .icon-btn { width:38px; height:34px; padding:0; justify-content:center; }

    .hint{
      position:relative;
      z-index:2;
      padding: 8px 12px;
      color: var(--muted);
      font-size:12px;
      border-bottom:1px solid var(--line);
      background: rgba(11,26,51,0.62);
      backdrop-filter: blur(6px);
      line-height: 1.35;
    }

    .table-wrap { position:relative; z-index:2; flex:1; overflow:auto; padding: 10px 10px 12px 10px; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; color: var(--txt); }

    thead th{
      position: sticky; top: 0; z-index: 2;
      background: rgba(10,19,40,0.92);
      border-bottom: 1px solid var(--line2);
      border-right: 1px solid var(--line);
      padding: 8px 8px;
      cursor: pointer;
      user-select:none;
      white-space: nowrap;
    }
    thead th:hover{
      background: rgba(43,124,255,0.16);
    }
    thead th .sort{
      margin-left:6px;
      color: rgba(231,238,252,0.75);
      font-weight:900;
    }

    th, td{
      border-bottom: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.07); /* 垂直格線 */
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
      background: rgba(0,0,0,0.00);
    }
    tbody tr:hover { background: rgba(43,124,255,0.08); }
    tbody tr.row-clickable { cursor: pointer; }
    tbody tr.row-clickable:hover { background: rgba(255,43,43,0.10); }

    .muted { color: var(--muted); }
    .err { color: #ffb0b0; white-space:pre-wrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    code { background: rgba(255,255,255,0.06); padding:2px 6px; border-radius:6px; }

    /* modal */
    .modal-backdrop{
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal{
      width: min(920px, 92vw);
      max-height: 86vh;
      background: linear-gradient(180deg, rgba(11,26,51,0.98) 0%, rgba(7,11,22,0.98) 100%);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
      overflow: hidden;
      display:flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .modal-header{
      padding: 10px 12px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
    }
    .modal-body{
      padding: 12px;
      overflow:auto;
      font-size: 12px;
      line-height: 1.45;
      color: var(--txt);
    }
    .kv { display:grid; grid-template-columns: 160px 1fr; gap:8px 10px; }
    .close-btn{
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      border-radius:10px;
      padding:6px 10px;
      cursor:pointer;
      font-weight:900;
      color: var(--txt);
    }
    .close-btn:hover{ background: rgba(43,124,255,0.10); border-color: rgba(43,124,255,0.35); }

    /* H3 count label */
    .agg-label{
      color:#fff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 1000;
      line-height: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.40);
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(220, 20, 20, 0.92);
      text-shadow: 0 0 10px rgba(255,80,80,0.35);
    }

    /* location rectangle label (move upward relative to count, same X) */
    .name-label{
      color:#fff;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 1000;
      line-height: 16px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.45);
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(220, 20, 20, 0.92);
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(-26px); /* 往上：與 count 同 X，但 Y 拉開距離 */
    }

    .h3-tip b { display:inline-block; min-width: 170px; }
    .h3-tip { line-height: 1.35; color: var(--txt); }

    /* Leaflet controls tech look */
    .res-ctrl{
      background: rgba(10,19,40,0.92);
      border:1px solid rgba(255,255,255,0.16);
      border-radius:12px;
      padding:10px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      font-size:12px;
      line-height:1.2;
      color: var(--txt);
      backdrop-filter: blur(6px);
    }
    .res-ctrl .ttl{
      font-weight:1000;
      margin-bottom:8px;
      letter-spacing:.5px;
      color: #d7e6ff;
      text-shadow: 0 0 10px rgba(43,124,255,0.25);
    }
    .res-ctrl label{
      display:flex; align-items:center; gap:6px;
      margin:6px 0; cursor:pointer; user-select:none;
      color: rgba(231,238,252,0.92);
    }
    .res-ctrl input{ cursor:pointer; accent-color: var(--accent); }

    .layer-ctrl{
      margin-top:8px;
      background: rgba(10,19,40,0.92);
      border:1px solid rgba(255,255,255,0.16);
      border-radius:12px;
      padding:10px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      font-size:12px;
      line-height:1.2;
      color: var(--txt);
      backdrop-filter: blur(6px);
    }
    .layer-ctrl .ttl{
      font-weight:1000;
      margin-bottom:8px;
      letter-spacing:.5px;
      color: #d7e6ff;
      text-shadow: 0 0 10px rgba(0,214,255,0.18);
    }
    .layer-ctrl label{
      display:flex; align-items:center; gap:6px;
      margin:6px 0; cursor:pointer; user-select:none;
      color: rgba(231,238,252,0.92);
    }
    .layer-ctrl input{ cursor:pointer; accent-color: var(--accent2); }

    /* point marker */
    .pmk{
      width: 28px; height: 28px;
      border-radius: 10px;
      display:flex; align-items:center; justify-content:center;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 6px 16px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
    }
    .pmk::before{
      content:"";
      position:absolute; inset:-20px;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22), transparent 40%);
      pointer-events:none;
    }
    .badgeSE{
      position:absolute;
      right:-5px; top:-5px;
      width: 16px; height: 16px;
      border-radius: 7px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.35);
      display:flex; align-items:center; justify-content:center;
      font-size: 11px;
      font-weight: 1000;
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.22);
    }
    .pmk svg{ width: 18px; height: 18px; display:block; }
  </style>
</head>

<body>
  <div class="app">
    <div id="map"></div>

    <div id="panel">
      <div class="topbar">
        <div class="title-wrap">
          <h2>THSR PA Analysis</h2>
          <div class="verTag" id="verTag"></div>
          <div class="selectionTag" id="selectionTag" title=""></div>
        </div>

        <div class="btns">
          <div class="btn icon-btn" id="btnMeasure" title="測距：啟用後左鍵點起點再點終點顯示距離">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm2 0v10h14V7H5zm2 2h2v2H7V9zm4 0h2v3h-2V9zm4 0h2v2h-2V9zm-8 6h2v2H7v-2zm4-1h2v3h-2v-3zm4 1h2v2h-2v-2z"/>
            </svg>
          </div>

          <div class="btn" id="btnInfo" title="系統資訊 / 狀態 / 錯誤訊息（彈窗）">🛈 系統資訊</div>
          <div class="btn" id="btnClear" title="清除篩選，顯示全部事件">清除篩選</div>
        </div>
      </div>

      <div class="hint">
        RES 單選顯示網格。紅格＝PA_data(start_H3)；藍格＝start_location_name 命中 THSR_Location(location_name) 產生（與紅格重複者不畫）。
        <br>數字與聚合統計：只計紅格；<b>點左側紅格 → 用 start_location_name 篩選右表</b>；點右表列 → 左側定位。
      </div>

      <div class="table-wrap">
        <table id="evtTable">
          <thead><tr id="evtHeadRow"></tr></thead>
          <tbody id="evtBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-label="系統資訊">
      <div class="modal-header">
        <div style="font-weight:1000;">系統資訊（狀態 / 更新 / 錯誤）</div>
        <button class="close-btn" id="btnModalClose">關閉</button>
      </div>
      <div class="modal-body">
        <div class="kv">
          <div class="muted">Version</div><div class="mono" id="mVersion"></div>
          <div class="muted">Page URL</div><div class="mono" id="mPageUrl"></div>
          <div class="muted">PA CSV</div><div class="mono" id="mCsvPA"></div>
          <div class="muted">Location CSV</div><div class="mono" id="mCsvLoc"></div>
          <div class="muted">HTTP</div><div class="mono" id="mHttp"></div>
          <div class="muted">H3</div><div class="mono" id="mH3"></div>
          <div class="muted">Status</div><div class="mono" id="mStatus"></div>
          <div class="muted">Last Update</div><div class="mono" id="mUpdate"></div>
        </div>

        <hr style="border:none;border-top:1px solid rgba(255,255,255,0.10);margin:12px 0;">

        <div style="font-weight:1000;margin-bottom:6px;">Errors</div>
        <div class="mono err" id="mErrors" style="white-space:pre-wrap;"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4.4.0/dist/h3-js.umd.js"></script>

  <script>
    // =============================
    // Version
    // =============================
    const APP_VERSION = "ver 5.3";
    document.getElementById('verTag').textContent = APP_VERSION;

    // =============================
    // Modal / status
    // =============================
    const modalBackdrop = document.getElementById('modalBackdrop');
    const btnInfo = document.getElementById('btnInfo');
    const btnModalClose = document.getElementById('btnModalClose');

    const mVersion = document.getElementById('mVersion');
    const mPageUrl = document.getElementById('mPageUrl');
    const mCsvPA = document.getElementById('mCsvPA');
    const mCsvLoc = document.getElementById('mCsvLoc');
    const mHttp = document.getElementById('mHttp');
    const mH3 = document.getElementById('mH3');
    const mStatus = document.getElementById('mStatus');
    const mUpdate = document.getElementById('mUpdate');
    const mErrors = document.getElementById('mErrors');

    let lastStatus = "init";
    let lastUpdateTime = "";
    const errorLogs = [];

    let httpInfo = "";
    let paCsvUrlAbs = "";
    let locCsvUrlAbs = "";
    let h3Info = "";

    function openModal() { modalBackdrop.style.display = "flex"; }
    function closeModal() { modalBackdrop.style.display = "none"; }

    function setStatus(msg) { lastStatus = msg; }
    function logError(err) {
      const s = String(err?.stack || err);
      errorLogs.push(s);
      if (!lastStatus.startsWith("FAILED")) setStatus("FAILED: " + (err?.message || s));
      console.error(err);
    }

    window.addEventListener('error', (e) => logError(e.error || e.message || e));
    window.addEventListener('unhandledrejection', (e) => logError(e.reason || e));

    btnInfo.addEventListener('click', () => {
      mVersion.textContent = APP_VERSION;
      mPageUrl.textContent = location.href;
      mCsvPA.textContent = paCsvUrlAbs || "(not set)";
      mCsvLoc.textContent = locCsvUrlAbs || "(not set)";
      mHttp.textContent = httpInfo || "(pending)";
      mH3.textContent = h3Info || "(pending)";
      mStatus.textContent = lastStatus;
      mUpdate.textContent = lastUpdateTime || '';
      mErrors.textContent = errorLogs.length ? errorLogs.join("\n\n") : "(none)";
      openModal();
    });

    btnModalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

    // =============================
    // Utils
    // =============================
    function escapeHtml(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function toClean(s) {
      const t = String(s ?? '').trim();
      return t === '' ? '' : t;
    }
    function uniqPreview(arr, max=2) {
      const a = Array.from(new Set(arr.filter(Boolean)));
      if (!a.length) return '';
      if (a.length <= max) return a.join('、');
      return `${a.slice(0,max).join('、')} +${a.length - max}`;
    }
    function parseMaybeNumber(v){
      const s = String(v ?? '').trim();
      if (s === '') return {isNum:false, num:0, raw:''};
      const n = Number(s);
      if (!Number.isNaN(n) && Number.isFinite(n)) return {isNum:true, num:n, raw:s};
      return {isNum:false, num:0, raw:s.toLowerCase()};
    }

    function parseCsvRobust(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur); cur = ''; }
          else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (ch === '\r') {}
          else cur += ch;
        }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }

      while (rows.length && rows[rows.length - 1].every(v => (v ?? '').trim() === '')) rows.pop();
      if (rows.length < 2) return [];

      let header = rows[0].map(h => (h ?? '').trim());
      if (header.length && header[0] && header[0].charCodeAt(0) === 0xFEFF) header[0] = header[0].replace('\uFEFF','');

      const data = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        if (!cols || cols.every(v => (v ?? '').trim() === '')) continue;
        const obj = {};
        for (let c = 0; c < header.length; c++) obj[header[c]] = (cols[c] ?? '').trim();
        data.push(obj);
      }
      return data;
    }

    async function fetchNoStore(absUrl) {
      const res = await fetch(absUrl, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText} (${absUrl})`);
      return res.text();
    }

    function initUrls() {
      paCsvUrlAbs = new URL(`./PA_data.csv?v=${Date.now()}`, location.href).toString();
      locCsvUrlAbs = new URL(`./THSR_Location.csv?v=${Date.now()}`, location.href).toString();
      httpInfo = "pending...";
      h3Info = "pending...";
    }
    initUrls();

    // =============================
    // Leaflet map + base layers
    // =============================
    const baseEMAP = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );
    const baseEMAP01 = L.tileLayer(
      'https://wmts.nlsc.gov.tw/wmts/EMAP01/default/GoogleMapsCompatible/{z}/{y}/{x}',
      { maxZoom: 19 }
    );

    const map = L.map('map', { center:[23.7,121.0], zoom:8, layers:[baseEMAP] });

    L.control.layers(
      { 'NLSC 彩色 (EMAP)': baseEMAP, 'NLSC 灰階 (EMAP01)': baseEMAP01 },
      null,
      { collapsed:false }
    ).addTo(map);

    // =============================
    // H3 layers (先宣告資料結構，避免 TDZ)
    // =============================
    const h3Layers = { RES8:L.layerGroup(), RES9:L.layerGroup(), RES10:L.layerGroup(), RES11:L.layerGroup() };
    const aggLabelLayer = L.layerGroup().addTo(map);
    const nameLabelLayer = L.layerGroup().addTo(map);

    // points layers
    const startPointLayer = L.layerGroup().addTo(map);
    const endPointLayer = L.layerGroup().addTo(map);
    let showStartPoints = true;
    let showEndPoints = true;

    const locMap = new Map();
    const redAgg = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };
    const blueAgg = { RES8:new Map(), RES9:new Map(), RES10:new Map(), RES11:new Map() };
    const redLabelItems = { RES8:[], RES9:[], RES10:[], RES11:[] };
    const layersByLocName = new Map();
    let highlightedLayers = new Set();

    let currentResKey = 'RES9';

    function clearHoverHighlights() {
      for (const ly of highlightedLayers) {
        if (ly && ly.__baseStyle) ly.setStyle(ly.__baseStyle);
      }
      highlightedLayers.clear();
    }
    function highlightByLocationNames(names) {
      clearHoverHighlights();
      for (const nm of names) {
        const set = layersByLocName.get(nm);
        if (!set) continue;
        for (const ly of set) {
          if (!ly.__baseStyle) continue;
          ly.setStyle({ weight: 3, color: '#ffd400', opacity: 1.0 });
          highlightedLayers.add(ly);
        }
      }
    }

    function bucketSizeForZoom(z) {
      return Math.max(26, 92 - z * 4);
    }

    function renderAggLabels() {
      aggLabelLayer.clearLayers();
      const items = redLabelItems[currentResKey] || [];
      if (!items.length) return;

      const z = map.getZoom();

      // ✅ zoom >= 12：改成「每格一個」count，方便和 name-label 同 X 對齊
      if (z >= 12) {
        for (const it of items) {
          const icon = L.divIcon({
            className: '',
            html: `<div class="agg-label">${escapeHtml(it.count)}</div>`,
            iconSize: null
          });
          L.marker(it.latlng, { icon, interactive:false, zIndexOffset: 9999 }).addTo(aggLabelLayer);
        }
        return;
      }

      // zoom < 12：維持聚合
      const bs = bucketSizeForZoom(z);
      const buckets = new Map();

      for (const it of items) {
        const p = map.latLngToContainerPoint(it.latlng);
        const bx = Math.floor(p.x / bs);
        const by = Math.floor(p.y / bs);
        const key = `${bx},${by}`;

        let b = buckets.get(key);
        if (!b) b = { sum:0, n:0, latSum:0, lngSum:0 };
        b.sum += it.count;
        b.n += 1;
        b.latSum += it.latlng.lat;
        b.lngSum += it.latlng.lng;
        buckets.set(key, b);
      }

      for (const b of buckets.values()) {
        if (!b.sum) continue;
        const lat = b.latSum / b.n;
        const lng = b.lngSum / b.n;

        const icon = L.divIcon({
          className: '',
          html: `<div class="agg-label">${escapeHtml(b.sum)}</div>`,
          iconSize: null
        });

        L.marker([lat, lng], { icon, interactive:false, zIndexOffset: 9999 }).addTo(aggLabelLayer);
      }
    }

    // ✅ name-label：用「同一個 latlng（cell center）」→ 同 X
    // CSS transform 往上拉（同 X、Y 上移留距離）
    function renderNameLabels() {
      nameLabelLayer.clearLayers();
      const z = map.getZoom();
      if (z < 12) return;

      const items = redLabelItems[currentResKey] || [];
      if (!items.length) return;

      for (const it of items) {
        if (!it.nameText) continue;

        const icon = L.divIcon({
          className: '',
          html: `<div class="name-label" title="${escapeHtml(it.nameText)}">${escapeHtml(it.nameText)}</div>`,
          iconSize: null
        });

        L.marker(it.latlng, { icon, interactive:false, zIndexOffset: 9000 }).addTo(nameLabelLayer);
      }
    }

    function showOnlyRes(resKey) {
      for (const k of ['RES8','RES9','RES10','RES11']) {
        if (map.hasLayer(h3Layers[k])) map.removeLayer(h3Layers[k]);
      }
      map.addLayer(h3Layers[resKey]);
      currentResKey = resKey;
      renderAggLabels();
      renderNameLabels();
      clearHoverHighlights();
    }

    // Resolution single-select control
    const ResControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'res-ctrl');
        div.innerHTML = `
          <div class="ttl">H3 Resolution</div>
          <label><input type="radio" name="res" value="RES8"> RES8</label>
          <label><input type="radio" name="res" value="RES9" checked> RES9</label>
          <label><input type="radio" name="res" value="RES10"> RES10</label>
          <label><input type="radio" name="res" value="RES11"> RES11</label>
        `;
        L.DomEvent.disableClickPropagation(div);
        div.querySelectorAll('input[name="res"]').forEach(inp => {
          inp.addEventListener('change', (e) => {
            if (e.target.checked) showOnlyRes(e.target.value);
          });
        });
        return div;
      }
    });
    map.addControl(new ResControl());

    // Layer control under res-control
    const LayerCtrl = L.Control.extend({
      options: { position:'topleft' },
      onAdd: function(){
        const div = L.DomUtil.create('div', 'layer-ctrl');
        div.innerHTML = `
          <div class="ttl">PA Points</div>
          <label><input type="checkbox" id="chkStart" checked> Start</label>
          <label><input type="checkbox" id="chkEnd" checked> End</label>
        `;
        L.DomEvent.disableClickPropagation(div);
        setTimeout(() => {
          const chkStart = div.querySelector('#chkStart');
          const chkEnd = div.querySelector('#chkEnd');

          chkStart.addEventListener('change', () => {
            showStartPoints = chkStart.checked;
            if (showStartPoints) map.addLayer(startPointLayer);
            else map.removeLayer(startPointLayer);
          });
          chkEnd.addEventListener('change', () => {
            showEndPoints = chkEnd.checked;
            if (showEndPoints) map.addLayer(endPointLayer);
            else map.removeLayer(endPointLayer);
          });
        }, 0);
        return div;
      }
    });
    map.addControl(new LayerCtrl());

    showOnlyRes('RES9');

    map.on('zoomend moveend', () => { renderAggLabels(); renderNameLabels(); });

    // =============================
    // Measure tool
    // =============================
    const btnMeasure = document.getElementById('btnMeasure');
    let measureActive = false;
    let measureStart = null;
    let measureStartMarker = null;
    let measureEndMarker = null;
    let measureLine = null;

    function clearMeasureGraphics() {
      if (measureStartMarker) { map.removeLayer(measureStartMarker); measureStartMarker = null; }
      if (measureEndMarker)   { map.removeLayer(measureEndMarker);   measureEndMarker = null; }
      if (measureLine)        { map.removeLayer(measureLine);        measureLine = null; }
      measureStart = null;
    }
    function formatDistance(meters) {
      if (meters >= 1000) return `${(meters/1000).toFixed(3)} km`;
      return `${meters.toFixed(1)} m`;
    }
    function onMapClickMeasure(e) {
      if (!measureActive) return;

      if (!measureStart) {
        clearMeasureGraphics();
        measureStart = e.latlng;
        measureStartMarker = L.circleMarker(measureStart, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureStartMarker.bindTooltip("起點", { permanent: false, direction: 'top' });
      } else {
        const end = e.latlng;
        measureEndMarker = L.circleMarker(end, { radius:6, weight:2, fillOpacity:0.7 }).addTo(map);
        measureEndMarker.bindTooltip("終點", { permanent: false, direction: 'top' });

        measureLine = L.polyline([measureStart, end], { weight:3, opacity:0.9 }).addTo(map);

        const dist = map.distance(measureStart, end);
        L.popup({ closeButton: true, autoClose: true })
          .setLatLng(end)
          .setContent(`距離：${formatDistance(dist)}`)
          .openOn(map);

        measureStart = null;
      }
    }
    map.on('click', onMapClickMeasure);

    btnMeasure.addEventListener('click', () => {
      measureActive = !measureActive;
      btnMeasure.classList.toggle('active', measureActive);
      if (!measureActive) measureStart = null;
    });

    // =============================
    // Table
    // =============================
    const evtHeadRow = document.getElementById('evtHeadRow');
    const evtBody = document.getElementById('evtBody');
    const selectionTag = document.getElementById('selectionTag');
    const btnClear = document.getElementById('btnClear');

    const COLS = [
      { key: 'Date', label: 'Date' },
      { key: 'start_location_name', label: 'S.loc' },
      { key: 'end_location_name', label: 'E.loc' },

      { key: 'PA_Num', label: 'PA#' },
      { key: 'event', label: 'Event' },
      { key: 'time_tw', label: 'Time' },
      { key: 'lag_start_tw', label: 'LagStart' },
      { key: 'resume_tw', label: 'Resume' },
      { key: 'lag_ms', label: 'Lag(ms)' },
      { key: 'e2e_recover_ms', label: 'E2E(ms)' },
      { key: 'e2e_recover_time', label: 'E2E(Time)' },
      { key: 'lag_end_tw', label: 'LagEnd' },
      { key: 'lag_mode', label: 'LagMode' },
      { key: 'gps_type', label: 'GPS' },
      { key: 'start_lat', label: 'S.lat' },
      { key: 'start_lon', label: 'S.lon' },
      { key: 'end_lat', label: 'E.lat' },
      { key: 'end_lon', label: 'E.lon' },
      { key: 'end_action', label: 'EndAct' },
      { key: 'accuracy_m', label: 'Acc(m)' },

      { key: 'start_H3_Res_8', label: 'S.H3(8)' },
      { key: 'start_H3_Res_9', label: 'S.H3(9)' },
      { key: 'start_H3_Res_10', label: 'S.H3(10)' },
      { key: 'start_H3_Res_11', label: 'S.H3(11)' },

      { key: 'end_H3_Res_8', label: 'E.H3(8)' },
      { key: 'end_H3_Res_9', label: 'E.H3(9)' },
      { key: 'end_H3_Res_10', label: 'E.H3(10)' },
      { key: 'end_H3_Res_11', label: 'E.H3(11)' },

      { key: 'measurement_Type', label: 'Type' },
      { key: 'measurement_Path', label: 'Path' },
      { key: 'measurement_NetWork', label: 'Net' },
      { key: 'measurement_Script', label: 'Script' },

      { key: 'start_location_KM+M', label: 'S.KM+M' },
      { key: 'end_location_KM+M', label: 'E.KM+M' },

      { key: 'Mcenter', label: 'Center' },
    ];

    function setSelectionTag(text) {
      selectionTag.textContent = text || '';
      selectionTag.title = text || '';
    }

    let allRows = [];
    let displayedRows = [];

    // sorting
    let sortKey = '';
    let sortDir = 1; // 1 asc, -1 desc

    function renderTableHeader() {
      evtHeadRow.innerHTML = '';
      for (const c of COLS) {
        const th = document.createElement('th');
        th.dataset.key = c.key;

        const label = document.createElement('span');
        label.textContent = c.label;
        th.appendChild(label);

        const sort = document.createElement('span');
        sort.className = 'sort';
        sort.textContent = (sortKey === c.key) ? (sortDir === 1 ? '▲' : '▼') : '';
        th.appendChild(sort);

        th.title = `排序：${c.key}`;
        th.addEventListener('click', () => {
          if (sortKey === c.key) sortDir = -sortDir;
          else { sortKey = c.key; sortDir = 1; }
          applySortAndRender();
        });

        evtHeadRow.appendChild(th);
      }
    }

    function applySortAndRender() {
      // keep current displayedRows source, just sort
      const rows = [...displayedRows];

      if (sortKey) {
        rows.sort((a,b) => {
          const av = parseMaybeNumber(a[sortKey]);
          const bv = parseMaybeNumber(b[sortKey]);

          if (av.isNum && bv.isNum) return (av.num - bv.num) * sortDir;
          if (av.isNum && !bv.isNum) return -1 * sortDir;
          if (!av.isNum && bv.isNum) return 1 * sortDir;
          return (av.raw > bv.raw ? 1 : av.raw < bv.raw ? -1 : 0) * sortDir;
        });
      }

      renderTableHeader();
      renderTableRows(rows, {skipHeader:true});
    }

    function renderTableRows(rows, opt={}) {
      displayedRows = rows;
      if (!opt.skipHeader) renderTableHeader();

      evtBody.innerHTML = '';
      const frag = document.createDocumentFragment();

      rows.forEach((r, idx) => {
        const tr = document.createElement('tr');
        tr.classList.add('row-clickable');

        for (const c of COLS) {
          const td = document.createElement('td');
          const v = (r[c.key] ?? '');
          td.textContent = v;
          td.title = v;
          tr.appendChild(td);
        }
        tr.addEventListener('click', () => onRowClick(idx));
        frag.appendChild(tr);
      });

      evtBody.appendChild(frag);
    }

    btnClear.addEventListener('click', () => {
      setSelectionTag('');
      displayedRows = [...allRows];
      sortKey = '';
      sortDir = 1;
      renderTableRows(displayedRows);
    });

    renderTableHeader();

    // =============================
    // H3 helper functions
    // =============================
    function resNumOfKey(resKey) {
      return resKey === 'RES8' ? 8 : resKey === 'RES9' ? 9 : resKey === 'RES10' ? 10 : 11;
    }

    function initMetaRed(resKey, h3Index) {
      return {
        resKey,
        resNum: resNumOfKey(resKey),
        h3Index,
        count: 0,
        paNums: new Set(),
        startNames: new Set(),
        endNames: new Set(),
        locPairs: new Set(),
      };
    }

    function initMetaBlue(resKey, h3Index) {
      return { resKey, resNum: resNumOfKey(resKey), h3Index, names: new Set() };
    }

    function buildHoverHtmlRed(meta, extraInfo) {
      // extraInfo：用一筆代表資料，把你要的資訊塞進 tooltip（含 KM+M / county / area / center）
      const startNames = Array.from(meta.startNames);
      const endNames = Array.from(meta.endNames);
      const paArr = Array.from(meta.paNums).map(x=>String(x)).filter(Boolean).sort((a,b)=>Number(a)-Number(b));

      const locNameLine = `${toClean(extraInfo?.start_location_name)}/${toClean(extraInfo?.end_location_name)}`.replaceAll('//','/').replace(/^\/|\/$/g,'');
      const kmLine = `${toClean(extraInfo?.["start_location_KM+M"])}/${toClean(extraInfo?.["end_location_KM+M"])}`.replaceAll('//','/').replace(/^\/|\/$/g,'');

      return `
        <div class="h3-tip">
          <div><b>H3_res${meta.resNum}:</b> ${escapeHtml(meta.h3Index)}</div>
          <div><b>location_name(start/end):</b> ${escapeHtml(locNameLine || uniqPreview(startNames,2) + '/' + uniqPreview(endNames,2))}</div>
          <div><b>location_KM+M:</b> ${escapeHtml(kmLine)}</div>
          <div><b>twcounty:</b> ${escapeHtml(toClean(extraInfo?.twcounty))}</div>
          <div><b>Marea:</b> ${escapeHtml(toClean(extraInfo?.Marea))}</div>
          <div><b>Mcenter:</b> ${escapeHtml(toClean(extraInfo?.Mcenter))}</div>
          <div><b>PA_Num:</b> ${escapeHtml(paArr.join('、'))}</div>
          <div><b>count:</b> ${escapeHtml(meta.count)}</div>
        </div>
      `;
    }

    function buildHoverHtmlBlue(meta) {
      const names = Array.from(meta.names);
      return `
        <div class="h3-tip">
          <div><b>H3_res${meta.resNum} (Location):</b> ${escapeHtml(meta.h3Index)}</div>
          <div><b>location_name:</b> ${escapeHtml(uniqPreview(names, 4))}</div>
        </div>
      `;
    }

    function addLayerToLocIndex(locationNames, polygonLayer) {
      for (const nm of locationNames) {
        if (!nm) continue;
        if (!layersByLocName.has(nm)) layersByLocName.set(nm, new Set());
        layersByLocName.get(nm).add(polygonLayer);
      }
    }

    // 左側點擊格子 -> 篩右表
    function filterTableByStartNames(names) {
      const arr = Array.from(new Set((names || []).filter(Boolean)));
      if (!arr.length) return;

      const filtered = allRows.filter(r => arr.includes(toClean(r.start_location_name)));
      displayedRows = filtered;

      // 保留目前排序規則
      if (sortKey) applySortAndRender();
      else renderTableRows(filtered);

      setSelectionTag(`已篩選 start_location_name：${arr.join('、')}（${filtered.length} 筆）`);
    }

    function addPolygonCell(meta, layerGroup, type) {
      const h3Index = meta.h3Index;
      const boundary = h3.cellToBoundary(h3Index);
      const latlngs = boundary.map(([lat, lng]) => [lat, lng]);

      const baseStyle = (type === 'red')
        ? { color:'#ff3b3b', weight:1, opacity:0.95, fillColor:'#ff0000', fillOpacity:0.14 }
        : { color:'#2b7cff', weight:1, opacity:0.95, fillColor:'#2b7cff', fillOpacity:0.12 };

      const poly = L.polygon(latlngs, baseStyle);
      poly.__baseStyle = baseStyle;
      poly.__type = type;
      poly.__meta = meta;
      layerGroup.addLayer(poly);

      const html = (type === 'red')
        ? buildHoverHtmlRed(meta, meta.__sampleRow)
        : buildHoverHtmlBlue(meta);

      poly.bindTooltip(html, { sticky:true, direction:'top', opacity:0.95 });

      poly.on('mouseover', () => {
        poly.setStyle({ weight: 2, fillOpacity: 0.20 });
        const names = (type === 'red') ? Array.from(meta.startNames) : Array.from(meta.names);
        highlightByLocationNames(names);
      });
      poly.on('mouseout', () => {
        clearHoverHighlights();
        poly.setStyle(baseStyle);
      });

      // ✅ 左→右互動：點紅格篩右表
      if (type === 'red') {
        poly.on('click', () => {
          const names = Array.from(meta.startNames);
          filterTableByStartNames(names);
        });
      }

      if (type === 'red') addLayerToLocIndex(Array.from(meta.startNames), poly);
      else addLayerToLocIndex(Array.from(meta.names), poly);

      return poly;
    }

    // =============================
    // Row click -> fly (右→左互動)
    // =============================
    function onRowClick(displayIdx) {
      const row = displayedRows[displayIdx];
      if (!row) return;

      const resKey = currentResKey;
      const hKey = resKey === 'RES8' ? 'start_H3_Res_8'
                : resKey === 'RES9' ? 'start_H3_Res_9'
                : resKey === 'RES10' ? 'start_H3_Res_10'
                : 'start_H3_Res_11';

      const h3Index = toClean(row[hKey]);
      if (!h3Index || !h3.isValidCell(h3Index)) {
        setSelectionTag(`定位失敗：${resKey} 的 start_H3 空白或無效`);
        return;
      }

      const c = h3.cellToLatLng(h3Index);
      map.flyTo([c[0], c[1]], Math.max(map.getZoom(), 14), { duration: 0.8 });
      setSelectionTag(`定位：${resKey} / ${h3Index}`);
    }

    // =============================
    // Point markers icons
    // =============================
    function netColor(net){
      const s = String(net ?? '').trim().toUpperCase();
      if (s === '4G') return 'rgba(18,64,255,0.92)'; // deep blue
      if (s === '5G') return 'rgba(255,154,60,0.92)'; // orange
      return 'rgba(43,124,255,0.92)';
    }

    function svgYouTube(){
      return `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M10 15.5V8.5L16 12l-6 3.5z"></path>
        <path fill="#fff" opacity="0.35" d="M21.6 7.2c-.2-.9-.9-1.6-1.8-1.8C18.1 5 12 5 12 5s-6.1 0-7.8.4c-.9.2-1.6.9-1.8 1.8C2 8.9 2 12 2 12s0 3.1.4 4.8c.2.9.9 1.6 1.8 1.8C5.9 19 12 19 12 19s6.1 0 7.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.7.4-4.8.4-4.8s0-3.1-.4-4.8z"></path>
      </svg>`;
    }

    function svgPhone(){
      return `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M6.6 10.8c1.2 2.3 3.1 4.2 5.4 5.4l1.8-1.8c.2-.2.6-.3.9-.2 1 .3 2 .5 3.1.5.5 0 .9.4.9.9v2.9c0 .5-.4.9-.9.9C10.7 19.4 4.6 13.3 4.6 6c0-.5.4-.9.9-.9h2.9c.5 0 .9.4.9.9 0 1.1.2 2.1.5 3.1.1.3 0 .7-.2.9l-1.6 1.8z"></path>
      </svg>`;
    }

    function scriptIcon(script){
      const s = String(script ?? '').trim();
      if (s === 'YoutubeLive') return svgYouTube();
      if (s === 'VoLTEmos') return svgPhone();
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#fff"/></svg>`;
    }

    function pointDivIcon({isStart, net, script}) {
      const bg = netColor(net);
      const badge = isStart ? 'S' : 'E';
      const html = `
        <div class="pmk" style="background:${bg}">
          ${scriptIcon(script)}
          <div class="badgeSE">${badge}</div>
        </div>
      `;
      return L.divIcon({ className:'', html, iconSize:[28,28], iconAnchor:[14,14] });
    }

    function tooltipStart(r){
      return `
        <div class="h3-tip">
          <div><b>Date:</b> ${escapeHtml(toClean(r.Date))}</div>
          <div><b>PA_Num:</b> ${escapeHtml(toClean(r.PA_Num))}</div>
          <div><b>lag_end_tw:</b> ${escapeHtml(toClean(r.lag_end_tw))}</div>
          <div><b>lag_ms:</b> ${escapeHtml(toClean(r.lag_ms))}</div>
          <div><b>e2e_recover_ms:</b> ${escapeHtml(toClean(r.e2e_recover_ms))}</div>
          <div><b>gps_type:</b> ${escapeHtml(toClean(r.gps_type))}</div>
          <div><b>lat/lon:</b> ${escapeHtml(toClean(r.start_lat))}, ${escapeHtml(toClean(r.start_lon))}</div>
          <div><b>measurement:</b> ${escapeHtml(toClean(r.measurement_Type))} / ${escapeHtml(toClean(r.measurement_Path))}</div>
          <div><b>NetWork:</b> ${escapeHtml(toClean(r.measurement_NetWork))}</div>
          <div><b>Script:</b> ${escapeHtml(toClean(r.measurement_Script))}</div>
          <div><b>KM+M:</b> ${escapeHtml(toClean(r["start_location_KM+M"]))}</div>
        </div>
      `;
    }

    function tooltipEnd(r){
      return `
        <div class="h3-tip">
          <div><b>Date:</b> ${escapeHtml(toClean(r.Date))}</div>
          <div><b>PA_Num:</b> ${escapeHtml(toClean(r.PA_Num))}</div>
          <div><b>lag_start_tw:</b> ${escapeHtml(toClean(r.lag_start_tw))}</div>
          <div><b>lag_ms:</b> ${escapeHtml(toClean(r.lag_ms))}</div>
          <div><b>e2e_recover_ms:</b> ${escapeHtml(toClean(r.e2e_recover_ms))}</div>
          <div><b>gps_type:</b> ${escapeHtml(toClean(r.gps_type))}</div>
          <div><b>lat/lon:</b> ${escapeHtml(toClean(r.end_lat))}, ${escapeHtml(toClean(r.end_lon))}</div>
          <div><b>measurement:</b> ${escapeHtml(toClean(r.measurement_Type))} / ${escapeHtml(toClean(r.measurement_Path))}</div>
          <div><b>NetWork:</b> ${escapeHtml(toClean(r.measurement_NetWork))}</div>
          <div><b>Script:</b> ${escapeHtml(toClean(r.measurement_Script))}</div>
          <div><b>KM+M:</b> ${escapeHtml(toClean(r["end_location_KM+M"]))}</div>
        </div>
      `;
    }

    function isValidLatLng(lat, lon){
      const a = Number(lat), b = Number(lon);
      return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180;
    }

    function rebuildPointLayers(rows){
      startPointLayer.clearLayers();
      endPointLayer.clearLayers();

      for (const r of rows) {
        const net = toClean(r.measurement_NetWork);
        const script = toClean(r.measurement_Script);

        // start
        if (isValidLatLng(r.start_lat, r.start_lon)) {
          const icon = pointDivIcon({isStart:true, net, script});
          const mk = L.marker([Number(r.start_lat), Number(r.start_lon)], { icon });
          mk.bindTooltip(tooltipStart(r), { sticky:true, direction:'top', opacity:0.95 });
          startPointLayer.addLayer(mk);
        }

        // end
        if (isValidLatLng(r.end_lat, r.end_lon)) {
          const icon = pointDivIcon({isStart:false, net, script});
          const mk = L.marker([Number(r.end_lat), Number(r.end_lon)], { icon });
          mk.bindTooltip(tooltipEnd(r), { sticky:true, direction:'top', opacity:0.95 });
          endPointLayer.addLayer(mk);
        }
      }

      // respect toggles
      if (!showStartPoints && map.hasLayer(startPointLayer)) map.removeLayer(startPointLayer);
      if (!showEndPoints && map.hasLayer(endPointLayer)) map.removeLayer(endPointLayer);
      if (showStartPoints && !map.hasLayer(startPointLayer)) map.addLayer(startPointLayer);
      if (showEndPoints && !map.hasLayer(endPointLayer)) map.addLayer(endPointLayer);
    }

    // =============================
    // Load + Render
    // =============================
    async function loadBothCSVsAndRender() {
      setStatus("starting...");

      if (typeof window.h3 === 'undefined') {
        h3Info = 'NOT LOADED (window.h3 is undefined)';
        throw new Error('h3 is not defined (h3-js 未載入成功)');
      } else {
        const v = window.h3?.versions?.h3 || window.h3?.VERSION || 'loaded';
        h3Info = `loaded (${v})`;
      }

      initUrls();
      setStatus("fetching PA & Location");
      httpInfo = "PA:pending | LOC:pending";

      const txtPA = await fetchNoStore(paCsvUrlAbs);
      httpInfo = "PA:OK | LOC:pending";

      let txtLoc = "";
      let locOk = true;
      try {
        txtLoc = await fetchNoStore(locCsvUrlAbs);
        httpInfo = "PA:OK | LOC:OK";
      } catch (e) {
        locOk = false;
        httpInfo = "PA:OK | LOC:FAILED (skip blue grids)";
        logError(e);
      }

      const rowsPA = parseCsvRobust(txtPA);
      const rowsLoc = locOk ? parseCsvRobust(txtLoc) : [];

      locMap.clear();
      for (const r of rowsLoc) {
        const name = toClean(r.location_name);
        if (!name) continue;
        if (!locMap.has(name)) locMap.set(name, []);
        locMap.get(name).push(r);
      }

      allRows = rowsPA;
      displayedRows = [...allRows];
      sortKey = '';
      sortDir = 1;
      renderTableRows(displayedRows);
      setSelectionTag('');

      // points layer build
      rebuildPointLayers(rowsPA);

      // clear layers & caches
      for (const k of ['RES8','RES9','RES10','RES11']) {
        h3Layers[k].clearLayers();
        redAgg[k].clear();
        blueAgg[k].clear();
        redLabelItems[k] = [];
      }
      layersByLocName.clear();
      clearHoverHighlights();

      function addRed(resKey, h3Index, row) {
        if (!h3Index) return;
        let meta = redAgg[resKey].get(h3Index);
        if (!meta) {
          meta = initMetaRed(resKey, h3Index);
          // ✅ 存一筆代表 row，用於 tooltip 取 KM+M / county / area / center
          meta.__sampleRow = row;
          redAgg[resKey].set(h3Index, meta);
        }
        meta.count += 1;

        const paNum = toClean(row.PA_Num); if (paNum) meta.paNums.add(paNum);
        const sn = toClean(row.start_location_name); const en = toClean(row.end_location_name);
        if (sn) meta.startNames.add(sn);
        if (en) meta.endNames.add(en);
        if (sn || en) meta.locPairs.add(`${sn}/${en}`);
      }

      for (const r of rowsPA) {
        addRed('RES8',  toClean(r.start_H3_Res_8),  r);
        addRed('RES9',  toClean(r.start_H3_Res_9),  r);
        addRed('RES10', toClean(r.start_H3_Res_10), r);
        addRed('RES11', toClean(r.start_H3_Res_11), r);
      }

      if (locOk) {
        function addBlue(resKey, h3Index, startName) {
          if (!h3Index) return;
          let meta = blueAgg[resKey].get(h3Index);
          if (!meta) { meta = initMetaBlue(resKey, h3Index); blueAgg[resKey].set(h3Index, meta); }
          if (startName) meta.names.add(startName);
        }

        for (const r of rowsPA) {
          const startName = toClean(r.start_location_name);
          if (!startName) continue;
          const matches = locMap.get(startName);
          if (!matches || !matches.length) continue;

          for (const locRow of matches) {
            addBlue('RES8',  toClean(locRow.H3_Res_8),  startName);
            addBlue('RES9',  toClean(locRow.H3_Res_9),  startName);
            addBlue('RES10', toClean(locRow.H3_Res_10), startName);
            addBlue('RES11', toClean(locRow.H3_Res_11), startName);
          }
        }

        for (const resKey of ['RES8','RES9','RES10','RES11']) {
          for (const h3Index of blueAgg[resKey].keys()) {
            if (redAgg[resKey].has(h3Index)) blueAgg[resKey].delete(h3Index);
          }
        }
      }

      const boundsAcc = L.latLngBounds([]);
      let redCells=0, blueCells=0;

      for (const resKey of ['RES8','RES9','RES10','RES11']) {
        const lg = h3Layers[resKey];

        for (const [h3Index, meta] of redAgg[resKey].entries()) {
          if (!h3.isValidCell(h3Index)) continue;

          const poly = addPolygonCell(meta, lg, 'red');
          boundsAcc.extend(poly.getBounds());
          redCells++;

          const center = h3.cellToLatLng(h3Index);
          const nameText = uniqPreview(Array.from(meta.locPairs), 1);
          redLabelItems[resKey].push({
            latlng: L.latLng(center[0], center[1]),
            count: meta.count,
            nameText
          });
        }

        if (locOk) {
          for (const [h3Index, meta] of blueAgg[resKey].entries()) {
            if (!h3.isValidCell(h3Index)) continue;
            const poly = addPolygonCell(meta, lg, 'blue');
            boundsAcc.extend(poly.getBounds());
            blueCells++;
          }
        }
      }

      if ((redCells+blueCells) > 0 && boundsAcc.isValid()) {
        map.fitBounds(boundsAcc.pad(0.12));
      }

      lastUpdateTime = new Date().toISOString();
      setStatus(`ok: rows=${rowsPA.length}, red_cells=${redCells}, blue_cells=${blueCells}`);
      renderAggLabels();
      renderNameLabels();
    }

    // =============================
    // Start (確保啟動)
    // =============================
    function startApp() {
      try {
        setStatus("booting...");
        setTimeout(async () => {
          try { await loadBothCSVsAndRender(); }
          catch (e) { logError(e); }
        }, 0);
      } catch (e) { logError(e); }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
